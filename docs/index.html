/* Keep the acting merchant and their decision together, independent of board position. */

function value(s, rules, i, who) {
  const t = rules.tiles[i];
  const district = rules.tiles.flatMap((other, k) => other.group === t.group ? [k] : []);
  const others = district.filter(k => k !== i && s.owners[k] === who).length;
  const remaining = (rules.rounds - s.round + 1) / rules.rounds;
  return t.price + Math.round(t.rent * remaining * (others === district.length - 1 ? 4 : others + 0.4));
}

export function botMove(s, rules) {
  const actor = actingSeat(s), cash = s.players[actor].cash;
  const reserve = Math.min(rules.salary, cash / 3);
  const step = rules.auction_increment;
  const send = (action, extra = {}) => ({action, actor, ...extra});
  if (s.phase === 'offer') {
    const tile = rules.tiles[s.players[actor].pos];
    // If rivals cannot meet the list price, try buying it cheaper at auction.
    const rival = Math.max(...s.players.map((p,i) => i === actor || p.out ? 0 : p.cash));
    return send(tile.price <= cash - reserve && rival >= tile.price ? 'buy' : 'pass');
  }
  if (s.phase === 'auction') {
    const {tile, high_bid} = s.auction;
    const ceiling = Math.min(value(s,rules,tile,actor), cash - reserve);
    const next = Math.max(high_bid + step, Math.floor((high_bid + (ceiling - high_bid) * 0.55) / step) * step);
    return ceiling < high_bid + step ? send('withdraw') : send('bid', {amount:Math.min(next,Math.floor(ceiling / step) * step)});
  }
  if (s.phase === 'trade') {
    const t = s.trade;
    const benefit = t.give_cash + (t.give_deed === null ? 0 : value(s,rules,t.give_deed,actor));
    const cost = t.take_cash + (t.take_deed === null ? 0 : value(s,rules,t.take_deed,actor));
    return send(benefit >= cost && cash - t.take_cash >= reserve ? 'accept' : 'reject');
  }
  if (s.phase === 'roll' && !s.traded) {
    // Seek mutually valuable acquisitions rather than sending speculative offers every turn.
    const deals = s.owners.flatMap((to, i) => {
      if (to === null || to === actor) return [];
      const max = value(s,rules,i,actor), min = value(s,rules,i,to);
      const give_cash = Math.ceil((max+min)/2);
      return max-min >= step && give_cash <= cash-reserve ? [{to,i,give_cash,margin:max-min}] : [];

    }
  }
  return send(s.phase);
}

    const tag=document.createElement('script'); tag.src='./peerjs.min.js';
    tag.onload=()=>resolve(window.Peer);
    tag.onerror=()=>{peerLoader=null;reject(Error('Could not load the network client. Open the published game online.'))};
    document.head.append(tag);
  });
  return peerLoader;
}
function hostRoom(){connectRoom(true,Array.from(crypto.getRandomValues(new Uint8Array(6)),n=>alphabet[n%32]).join(''))}
function roomMenu(joinOnly=false){
  if(room){
    if(room.host && room.ready && !room.started){hostLobby(room);return}
    openDialog('<h2>Network table</h2><p id="roomInfo"></p><button id="leave">Leave table</button>');
    $('roomInfo').textContent=room.started?`Table ${room.code}. Keep all devices connected.`:
      room.device?`Table ${room.code} · Device ${room.device}. Waiting for the host to start.`:'Connecting to the table…';
    if(room.resuming&&!room.ready&&!room.started){
      $('leave').textContent='Cancel reconnect';
      $('leave').onclick=()=>finishRoom(room,'Reconnect cancelled. The saved table is still available.');
    }else $('leave').onclick=()=>{if(!room.started||confirm('Leave and end this match for everyone?'))endRoom('You left the table.')};
    return;
  }
  openDialog(`<h2>Join a table</h2><p>Enter the six-character code from your host.</p>
    <form id="joinForm"><label class="field">Table code<input id="code" maxlength="6" minlength="6" required autocapitalize="characters" autocomplete="off" spellcheck="false"></label><button class="primary">Join table</button></form>
    ${joinOnly?'':'<hr><button id="host">Host instead</button>'}`);
  if($('host'))$('host').onclick=hostRoom;
  $('code').focus();
  $('joinForm').onsubmit=e=>{
    e.preventDefault();const code=$('code').value.trim().toUpperCase();
    if(!/^[A-HJ-NP-Z2-9]{6}$/.test(code)){
      $('code').setCustomValidity('Enter the six letters or digits from the host.');$('code').reportValidity();$('code').setCustomValidity('');return
    }
    connectRoom(false,code);
  };
}
function finishRoom(r,reason,{forget=false,notify=false}={}){
  if(room!==r)return;
  room=null;r.step?.abort();clearTimeout(r.timeout);
  if(forget&&r.hasSave)try{localStorage.removeItem(saveKey)}catch{reason+=' Could not clear browser storage.'}
  if(notify){broadcast(r,{kind:'ended'});setTimeout(()=>r.peer?.destroy(),350)}else r.peer?.destroy();
  r.unlock?.();
  document.querySelector('.live').textContent='Local table';
  $('setupBtn').textContent='New table';
  play(['human','bot','bot']).catch(report);
  openDialog(`<h2>Network table</h2><p id="reason"></p>${savedTableButton()} <button id="retry">Table setup</button>`);
  $('reason').textContent=reason;$('retry').onclick=setup;bindSavedTableButton();
}
function endRoom(reason){
  const r=room;if(!r)return;
  if(!r.host&&r.started&&r.link?.open){
    r.step?.abort();r.leaving=true;$('actions').textContent='Waiting for the host to confirm leave…';
    r.link.send({kind:'leave'});
    clearTimeout(r.timeout);r.timeout=setTimeout(()=>finishRoom(r,'Leave not confirmed. Rejoin to check whether the host ended the match.'),10000);return;
  }
  finishRoom(r,reason,{forget:true,notify:r.host});
}
function hostLobby(r){
  openDialog(`<h2>Invite players</h2><div class="invite"><strong id="tableCode"></strong><button id="copyCode">Copy code</button></div><p>Guests choose New table → Join online. Keep this tab open.</p>${settings()}<div id="assign"></div><p id="roster"></p><button id="launch" class="primary">Start network game</button> <button id="leave">Close table</button>`);
  $('tableCode').textContent=r.code;
  $('copyCode').onclick=async e=>{const btn=e.currentTarget;try{await navigator.clipboard.writeText(r.code);btn.textContent='Copied'}catch{btn.textContent='Select code to copy';const range=document.createRange();range.selectNodeContents($('tableCode'));const sel=getSelection();sel.removeAllRanges();sel.addRange(range)}};
  $('map').value=r.map;$('clock').value=String(r.seconds);
  $('map').onchange=()=>r.map=$('map').value;$('clock').onchange=()=>r.seconds=Number($('clock').value);
  const ids=[...r.links.keys()];
  $('assign').innerHTML=r.slots.map((v,i)=>`<label class="field">${seat(i)}<select id="owner${i}">${[...(i<2?[]:[-2]),0,...ids,-1].map(n=>`<option value="${n}" ${v===n?'selected':''}>${n===-2?'Empty':n===-1?'Bot':n===0?'Host device':'Device '+n}</option>`).join('')}</select></label>`).join('');
  r.slots.forEach((v,i)=>$('owner'+i).onchange=e=>r.slots[i]=Number(e.target.value));
  $('roster').textContent=ids.length?`Connected: ${ids.map(i=>'Device '+i).join(', ')}. Assign each device at least one seat.`:'Waiting for another device…';
  $('launch').disabled=!ids.length||ids.some(id=>!r.enrolled.has(id));
  $('leave').onclick=()=>endRoom('The host closed the table.');
  $('launch').onclick=()=>{
    const owners=r.slots.filter(v=>v!==-2);
    if(ids.some(id=>!owners.includes(id))){$('roster').textContent='Assign at least one seat to every connected guest.';return}
    const config={owners,map:r.map,seconds:r.seconds,seed:crypto.getRandomValues(new Uint32Array(1))[0]};
    try{
      r.save={role:'host',code:r.code,config,keys:r.keys,journal:[],remaining:config.seconds*1000};
      persist(r);startNetwork(r,config);for(const link of r.links.values())sendReplay(r,link);
      hostStatus(r);
    }catch(e){finishRoom(r,`Could not start: ${e.message}`)}
  };
}
function persist(r){
  localStorage.setItem(saveKey,JSON.stringify(r.save));r.hasSave=true;
}
function remaining(r){return r.deadline?Math.max(0,r.deadline-performance.now()):r.remaining}
function hostStatus(r){
  if(room!==r||!r.started)return;
  const missing=[...new Set(r.owners.filter(id=>id>0&&!r.synced.has(id)))];
  r.remaining=remaining(r);r.deadline=0;r.missing=missing;
  r.save.remaining=r.remaining;
  try{persist(r)}catch{finishRoom(r,'Cannot save the clock. Free browser storage, then rehost the last saved turn.');return}
  broadcast(r,{kind:'status',seq:r.seq,missing,remaining:r.remaining});networkStep(r);
}
function sendReplay(r,link){
  const journal=r.save.journal;
  link.send({kind:'start',config:r.save.config,count:journal.length});
  for(let i=0;i<journal.length;i+=40)link.send({kind:'replay',moves:journal.slice(i,i+40)});
  link.send({kind:'caughtUp',seq:r.seq});
}
async function connectRoom(host,code,resume=false){
  if(room)return;
  session?.abort();
  const r=room={host,code,resuming:resume,device:0,links:new Map(),enrolled:new Set(),synced:new Set(),keys:{},slots:[0,-1,-2,-2],map:$('board').dataset.map,seconds:clockSeconds,seq:0,missing:[]};
  $('setupBtn').textContent='Network table';document.querySelector('.live').textContent=`Table ${code}`;
  $('actions').replaceChildren();roomMenu();
  const fail=msg=>{if(room===r)finishRoom(r,msg)};
  r.timeout=setTimeout(()=>fail('Connection timed out. Check the code and try a different network.'),25000);
  try{
    await new Promise((ok,no)=>withTableLock(()=>new Promise(release=>{r.unlock=release;ok()})).catch(no));
    if(room!==r){r.unlock();return}
    const saved=readTable();
    if(saved&&!resume){fail('Resume or forget your saved table before starting another online match.');return}
    if(resume){
      if(!saved||saved.code!==code||saved.role!==(host?'host':'guest'))throw Error('Table save changed. Reopen table setup.');
      r.save=saved;r.hasSave=true;
      if(host){
        if(!Array.isArray(saved.journal)||!saved.config.owners.every(id=>id<=0||validKey(saved.keys[id])))throw Error('Invalid host save');
        r.keys=saved.keys;startNetwork(r,saved.config);
        for(const move of saved.journal)replay(r,move);
        r.remaining=Math.max(0,Math.min(saved.remaining??r.remaining,r.seconds*1000));
      }else{
        if(!validKey(saved.key)||![1,2,3].includes(saved.device))throw Error('Invalid device save');
        r.device=saved.device;
      }
    }else{
      // Refuse to seat anyone when storage is disabled.
      localStorage.setItem(saveKey+'.probe','1');localStorage.removeItem(saveKey+'.probe');
    }
    const Peer=await loadPeer();if(room!==r)return;
    r.peer=host?new Peer(protocol+code):new Peer();
    r.peer.on('error',e=>fail(`Connection error (${e.type}). ${resume?'Check the original host/code, close any old host tab and retry the saved table shortly.':'Check the code and try again.'}`));
    r.peer.on('disconnected',()=>fail('The signaling service disconnected. Reconnect and retry.'));
    r.peer.on('open',()=>{
      if(room!==r)return;
      if(host){
        clearTimeout(r.timeout);r.ready=true;
        if(r.started)hostStatus(r);else hostLobby(r);return;
      }
      const link=r.peer.connect(protocol+code,{reliable:true,serialization:'json'});r.link=link;
      const nonce=randomHex();let authenticated=false;
      link.on('open',()=>link.send(resume?{kind:'hello',id:r.device,nonce}:{kind:'join'}));
      link.on('close',()=>fail('Host disconnected. Wait for the original host to rehost, then rejoin.'));
      link.on('error',()=>fail('The connection to the host failed.'));
      link.on('data',async msg=>{
        if(room!==r)return;
        try{
          if(!msg||typeof msg!=='object')throw Error('Invalid message');
          if(msg.kind==='closed'){fail('This table is unavailable, or this device is already connected.');return}
          if(resume&&!authenticated&&msg.kind==='challenge'&&validKey(msg.nonce)){
            const args=[code,r.device,nonce,msg.nonce];
            if(msg.mac!==await proof(r.save.key,'host',...args))throw Error('Host identity did not match');
            authenticated=true;link.send({kind:'proof',mac:await proof(r.save.key,'guest',...args)});return;
          }
          if(!resume&&!authenticated&&msg.kind==='welcome'&&[1,2,3].includes(msg.device)&&validKey(msg.key)){
            r.device=msg.device;r.save={role:'guest',code,device:r.device,key:msg.key};persist(r);
            authenticated=true;clearTimeout(r.timeout);link.send({kind:'enrolled'});roomMenu();return;
          }
          if(!authenticated)throw Error('Unverified host');
          if(msg.kind==='ended'){finishRoom(r,'The host or a device deliberately ended the table.',{forget:true});return}
          if(msg.kind==='start'&&!r.started&&Number.isSafeInteger(msg.count)&&msg.count>=0){
            r.count=msg.count;startNetwork(r,msg.config);
          }else if(msg.kind==='replay'&&r.count!==undefined&&Array.isArray(msg.moves)&&msg.moves.length<=40){
            for(const move of msg.moves)replay(r,move);
          }else if(msg.kind==='caughtUp'&&msg.seq===r.seq&&r.count===r.seq){
            delete r.count;clearTimeout(r.timeout);link.send({kind:'ready',seq:r.seq});
          }else if(msg.kind==='status'&&r.started&&msg.seq===r.seq&&Array.isArray(msg.missing)&&Number.isFinite(msg.remaining)){
            r.missing=msg.missing;r.remaining=msg.remaining;r.deadline=0;networkStep(r);
          }else if(msg.kind==='commit'&&r.started&&msg.seq===r.seq+1){
            replay(r,msg.move);r.remaining=r.seconds*1000;r.deadline=0;networkStep(r);
          }else if(msg.kind==='reject'&&msg.seq===r.seq){r.remaining=remaining(r);networkStep(r)}
          else throw Error('Out-of-order or incompatible host message');
        }catch(e){fail(`Could not synchronize: ${e.message}`)}
      });
    });
    r.peer.on('connection',link=>{
      if(!host){link.close();return}
      let id,challenge;
      const deny=()=>{link.send({kind:'closed'});setTimeout(()=>link.close(),150)};
      const handshake=setTimeout(()=>{if(!id)link.close()},15000);
      link.on('data',async msg=>{
        if(room!==r)return;
        if(!id){
          if(msg?.kind==='join'&&!r.started&&r.links.size<3){
            id=[1,2,3].find(i=>!r.links.has(i));r.links.set(id,link);r.keys[id]=randomHex();
            const available=r.slots.findIndex(v=>v===-1||v===-2);if(available!==-1)r.slots[available]=id;
            link.send({kind:'welcome',device:id,key:r.keys[id]});clearTimeout(handshake);hostLobby(r);return;
          }
          if(msg?.kind==='hello'&&!challenge&&r.started&&[1,2,3].includes(msg.id)&&validKey(msg.nonce)&&r.owners.includes(msg.id)&&!r.links.has(msg.id)){
            const n=randomHex(),args=[code,msg.id,msg.nonce,n];
            challenge={id:msg.id};
            challenge.expected=await proof(r.keys[msg.id],'guest',...args);
            link.send({kind:'challenge',nonce:n,mac:await proof(r.keys[msg.id],'host',...args)});return;
          }
          if(msg?.kind==='proof'&&validKey(msg.mac)&&msg.mac===challenge?.expected&&!r.links.has(challenge.id)){
            id=challenge.id;r.links.set(id,link);clearTimeout(handshake);sendReplay(r,link);return;
          }
          deny();return;
        }
        if(r.links.get(id)!==link)return;
        if(!r.started){if(msg?.kind==='enrolled'&&!r.enrolled.has(id)){r.enrolled.add(id);hostLobby(r)}return}
        if(msg?.kind==='leave'){finishRoom(r,`Device ${id} deliberately left the table.`,{forget:true,notify:true});return}
        if(msg?.kind==='ready'&&msg.seq===r.seq&&!r.synced.has(id)){r.synced.add(id);hostStatus(r);return}
        if(msg?.kind==='intent'&&msg.seq===r.seq&&!r.missing.length)acceptMove(r,id,msg.move);
      });
      const lost=()=>{
        clearTimeout(handshake);if(room!==r||r.links.get(id)!==link)return;
        r.links.delete(id);
        if(r.started){r.synced.delete(id);hostStatus(r);return}
        delete r.keys[id];r.enrolled.delete(id);
        r.slots=r.slots.map((v,i)=>v===id?(i<2?-1:-2):v);hostLobby(r);
      };
      link.on('close',lost);link.on('error',lost);
    });
  }catch(e){fail(e.message)}
}
function broadcast(r,msg){for(const link of r.links.values())link.send(msg)}
function startNetwork(r,c){
  if(!c||!['compact','outer'].includes(c.map)||![0,5,15,30].includes(c.seconds)||
     !Number.isInteger(c.seed)||c.seed<0||c.seed>0xffffffff||!Array.isArray(c.owners)||
     c.owners.length<2||c.owners.length>4||!c.owners.every(n=>[-1,0,1,2,3].includes(n))||
     (!r.host&&!c.owners.includes(r.device)))throw Error('Invalid host settings');
  r.started=true;r.owners=c.owners;r.seconds=c.seconds;r.remaining=c.seconds*1000;
  initialize(c.owners.map(n=>n<0?'bot':'human'),c.map,c.seconds,c.seed);
  $('modal').close();
}
function replay(r,move){
  if(!(playable.has(move?.action)||move?.action==='end'))throw Error('Invalid journal command');
  state=command(move);r.seq++;
}
function commit(r,move){
  state=command(move);
  r.save.journal.push(move);r.save.remaining=r.remaining=r.seconds*1000;r.deadline=0;
  // A move becomes visible to players only after the atomic storage write succeeds.
  try{persist(r)}catch{finishRoom(r,'Move not recorded. Free browser storage and rehost the last saved turn.');return}
  r.seq++;
  broadcast(r,{kind:'commit',seq:r.seq,move});
  networkStep(r);
}
function acceptMove(r,device,move){
  const actor=actingSeat(state);
  if(r.missing.length||!playable.has(move?.action)||move.actor!==actor||r.owners[actor]!==device||state.phase==='over'||state.phase==='end')return;
  const fields=move.action==='propose'?['to','give_deed','take_deed','give_cash','take_cash']:move.action==='bid'?['amount']:[];
  if(fields.some(k=>!Number.isSafeInteger(move[k])&&!(k.endsWith('_deed')&&move[k]===null))){
    r.links.get(device)?.send({kind:'reject',seq:r.seq});return;
  }
  move=Object.fromEntries(['action','actor',...fields].map(k=>[k,move[k]]));
  if(r.deadline&&performance.now()>=r.deadline){commit(r,{action:'withdraw',actor});return}
  try{commit(r,move)}catch(e){
    if(device>0)r.links.get(device)?.send({kind:'reject',seq:r.seq});
    else {r.remaining=remaining(r);networkStep(r)}
  }
}
function networkStep(r){
  r.step?.abort();r.step=new AbortController();
  const {signal}=r.step,seq=r.seq,actor=actingSeat(state),owner=r.owners[actor];
  if($('contract')&&$('modal').open)$('modal').close();
  render();r.deadline=0;
  if(state.phase==='over')return;
  const deviceName=n=>n<0?'Bot':n===r.device?'This device':n===0?'Host':`Device ${n}`;
  $('controlType').textContent=`${seat(actor)} · ${deviceName(owner)}`;
  const timed=state.phase==='auction'&&clockSeconds&&owner>=0;
  if(r.missing.length){
    $('actions').textContent=`Table paused · Waiting for ${r.missing.map(n=>'Device '+n).join(', ')} to rejoin from the original browser.`;
    if(timed){
      const meter=makeBidMeter('Host bid clock',clockSeconds*1000);
      $('actions').prepend(meter.element);meter.update(r.remaining,true);
    }
    return;
  }
  if(r.leaving){$('actions').textContent='Waiting for leave confirmation…';return}
  if(state.phase==='end'||owner===-1){
    if(r.host)wait(state.phase==='end'?950:850,signal).then(()=>{
      if(!signal.aborted)commit(r,state.phase==='end'?{action:'end',actor:state.turn}:botMove(state,rules));
    });
    return;
  }
  if(owner===r.device){
    controllers.human(state,signal).then(move=>{
      if(!move||signal.aborted)return;
      if(r.host)acceptMove(r,0,move);
      else {r.link.send({kind:'intent',seq,move});$('actions').textContent='Waiting for host…'}
    });
  }else $('actions').textContent=`Waiting for ${deviceName(owner)}…`;
  if(timed){
    r.deadline=performance.now()+r.remaining;
    const meter=makeBidMeter('Host bid clock',clockSeconds*1000);$('actions').prepend(meter.element);
    const tick=()=>{
      const ms=r.deadline-performance.now();
      meter.update(ms);
      if(r.host&&ms<=0)commit(r,{action:'withdraw',actor});
    };
    const timer=setInterval(tick,100);signal.addEventListener('abort',()=>clearInterval(timer),{once:true});tick();
  }
  window.addEventListener('pagehide',()=>{
    const r=room;if(!r)return;
    if(r.host&&r.started&&r.hasSave&&r.deadline){
      r.save.remaining=remaining(r);try{persist(r)}catch{/* previous journal remains intact */}
    }
    room=null;r.step?.abort();clearTimeout(r.timeout);r.peer?.destroy();r.unlock?.();
  });
  window.addEventListener('pageshow',e=>{if(e.persisted&&!room&&$('setupBtn').textContent==='Network table')location.reload()});
}

const $ = id => document.getElementById(id);
const maps = {compact:JSON.parse($('config').textContent),outer:JSON.parse($('outer').textContent)};
const DEFAULT_CLOCK=5;
let rules=maps.compact, clockSeconds=DEFAULT_CLOCK;
const colors = ['#a54d37','#347367','#936c20','#5d608a'];
const bands = {'Old Town':'#b76952', Foundry:'#d39e47', Market:'#7989a9', Marina:'#589587', Shipyards:'#ac84a2', Exchange:'#7195aa'};
const money = n => '$' + n.toLocaleString('en-US');
const seat = n => `Seat ${n + 1}`;
let engine, state, seats, session;

function command(input) {
  const bytes = new TextEncoder().encode(JSON.stringify(input));
  const ptr = engine.reserve(bytes.length);
  new Uint8Array(engine.memory.buffer, ptr, bytes.length).set(bytes);
  const out = engine.dispatch();
  const result = JSON.parse(new TextDecoder().decode(new Uint8Array(engine.memory.buffer, out, engine.length())));
  if (result.error) throw new Error(result.error);
  return result;
}

const deeds = (s, who) => s.owners.flatMap((owner,i)=>owner===who?[i]:[]);
function compose(s, send) {
  const a=s.turn;
  const peers=s.players.flatMap((p,i)=>!p.out && i!==a && (deeds(s,i).length||deeds(s,a).length)?[i]:[]);
  openDialog(`<small>PRIVATE CONTRACT · ${seat(a)}</small><h2>Draft a trade</h2><p>Exchange a deed for cash, another deed, or both. One proposal per turn.</p>
    <form id="contract"><label class="field">Trade with<select id="partner">${peers.map(i=>`<option value="${i}">${seat(i)}</option>`)}</select></label>
    <div id="terms"></div><p id="tradeError" role="alert"></p><button class="primary">Send proposal</button></form>`);
  const leg=(who,key,title)=>`<fieldset><legend>${title} · ${seat(who)}</legend><label class="field">Deed<select id="${key}Deed"><option value="">No deed</option>${deeds(s,who).map(i=>`<option value="${i}">${rules.tiles[i].name} · ${money(rules.tiles[i].price)}</option>`)}</select></label><label class="field">Cash ($)<input type="number" step="1" min="0" max="${s.players[who].cash}" id="${key}Cash" value="0" required></label></fieldset>`;
  const terms=()=>{
    const other=+$('partner').value;
    $('terms').innerHTML=leg(a,'give','You offer')+leg(other,'take','You request');
    const buy=deeds(s,other).length>0, i=deeds(s,buy?other:a)[0];
    $(buy?'takeDeed':'giveDeed').value=String(i);
    $(buy?'giveCash':'takeCash').value=Math.min(rules.tiles[i].price,s.players[buy?a:other].cash);
    $('tradeError').textContent='';
  };
  terms();$('partner').onchange=terms;
  $('contract').onsubmit=e=>{
    e.preventDefault();
    const index=id=>$(id).value===''?null:Number($(id).value);
    const deal={to:+$('partner').value,give_deed:index('giveDeed'),take_deed:index('takeDeed'),give_cash:+$('giveCash').value,take_cash:+$('takeCash').value};
    if((deal.give_deed===null&&!deal.give_cash)||(deal.take_deed===null&&!deal.take_cash)||(deal.give_cash&&deal.take_cash)){
      $('tradeError').textContent='Each side must contribute. Put cash on only one side.';return;
    }
    $('modal').close();send('propose',deal);
  };
}
function wait(ms,signal) {
  return new Promise(resolve=>{
    const t=setTimeout(resolve,ms);
    signal.addEventListener('abort',()=>{clearTimeout(t);resolve()},{once:true});
  });
}
function makeBidMeter(prefix,totalMs) {
  const element=document.createElement('div');element.className='bidClock';
  const label=document.createElement('span');label.setAttribute('role','timer');
  const bar=document.createElement('progress');bar.max=totalMs;bar.value=totalMs;
  bar.setAttribute('aria-label','Bid time remaining');
  element.append(label,bar);
  function update(ms,paused=false){
    bar.value=Math.max(0,Math.min(ms,totalMs));
    const seconds=Math.ceil(bar.value/1000);
    label.textContent=`${paused?'Paused':prefix} · ${seconds}s remaining`;
    bar.setAttribute('aria-valuetext',`${seconds} seconds remaining`);
    element.classList.toggle('urgent',!paused&&bar.value<=2000);
  }
  update(totalMs);
  return {element,update};
}
function bidClock(seconds,signal,onExpiry) {
  const meter=makeBidMeter('Bid clock',seconds*1000);
  $('actions').prepend(meter.element);
  let left=seconds*1000, since=null, expired=false;
  const remaining=()=>left-(since===null?0:performance.now()-since);
  function update(){
    if(expired||signal.aborted)return;
    if(document.hidden||$('modal').open){
      left=remaining();since=null;
    }else if(since===null){since=performance.now()}
    const ms=remaining();
    if(ms<=0){expired=true;onExpiry();return}
    meter.update(ms,since===null);
  }
  const timer=setInterval(update,100);
  document.addEventListener('visibilitychange',update,{signal});
  $('modal').addEventListener('clockchange',update,{signal});
  $('modal').addEventListener('close',update,{signal});
  signal.addEventListener('abort',()=>clearInterval(timer),{once:true});
  update();
  return ()=>{update();return !expired};
}
const controllers = {
  human: (s, signal) => new Promise(resolve => {
    const actor=actingSeat(s), cash=s.players[actor].cash;
    const send=(action,extra={})=>resolve({action,actor,...extra});
    signal.addEventListener('abort',()=>resolve(null),{once:true});
    function button(label,fn,primary=false,disabled=false) {
      const b = document.createElement('button');
      b.textContent = label;
      b.disabled = disabled;
      b.className = primary ? 'primary' : '';
      b.addEventListener('click',fn,{signal});
      $('actions').append(b);
      return b;
    }
    if(s.phase==='roll'){
      button('Roll dice',()=>send('roll'),true);
      if(!s.traded && s.owners.some(o=>o!==null)) button('Draft trade',()=>compose(s,send));
    }else if(s.phase==='offer'){
      const cost=rules.tiles[s.players[actor].pos].price;
      button(`Buy · ${money(cost)}`,()=>send('buy'),true,cash<cost);
      button('Start auction',()=>send('pass'));
    }else if(s.phase==='auction'){
      const min=s.auction.high_bid+rules.auction_increment;
      const inTime=clockSeconds&&!room?bidClock(clockSeconds,signal,()=>send('withdraw')):()=>true;
      if(cash>=min) {
        const bid=amount=>{if(inTime())send('bid',{amount})};
        button(`Bid ${money(min)}`,()=>bid(min),true);
        const jump=min+2*rules.auction_increment;
        if(jump<=cash)button(`Bid ${money(jump)}`,()=>bid(jump));
        button('Custom',()=>{
          openDialog(`<h2>Custom bid</h2><p>${money(min)} minimum · ${money(cash)} available${room?' · Host clock continues':''}</p><form id="bidForm"><label class="field">Amount ($)<input id="amount" type="number" min="${min}" max="${cash}" step="1" required value="${min}"></label><button class="primary">Place bid</button></form>`);
          $('amount').select();
          $('bidForm').onsubmit=e=>{e.preventDefault();const n=+$('amount').value;$('modal').close();bid(n)};
          signal.addEventListener('abort',()=>{if($('bidForm')&&$('modal').open)$('modal').close()},{once:true});
        });
      }
      button('Withdraw',()=>send('withdraw'));
    }else if(s.phase==='trade'){
      button('Accept trade',()=>send('accept'),true);button('Decline',()=>send('reject'));
    }
  }),
  bot: async (s, signal) => {await wait(850,signal);return botMove(s,rules)}
};

function boardPosition(i) {
  const edge=rules.tiles.length/4, side=edge+1;
  if(i<=edge)return [side-i,1];
  if(i<=2*edge)return [1,i-edge+1];
  if(i<=3*edge)return [i-2*edge+1,side];
  return [side,4*edge+1-i];
}
function openDialog(html) {
  $('content').innerHTML = html;
  if (!$('modal').open) $('modal').showModal();
  const heading=$('content').querySelector('h2');if(heading){heading.id='sheetTitle';$('modal').setAttribute('aria-labelledby','sheetTitle')}
  $('modal').scrollTop=0;
  $('modal').dispatchEvent(new Event('clockchange'));
}
function detail(i) {
  const t = rules.tiles[i], owner = state.owners[i];
  const info = {
    deed:`${t.group} district. Price ${money(t.price ?? 0)}; rent ${money(t.rent ?? 0)}. Double rent for a complete district.`,
    start:`Collect ${money(rules.salary)} each time you pass or land here.`,
    fee:`Pay ${money(t.price ?? 0)} to the port authority.`,
    notice:'Draw a port notice for a cash award or unexpected bill.',
    rest:'A safe harbor. No payment is due here.'
  };
  openDialog(`<h2>${t.name}</h2>${t.kind==='deed'?`<p>${t.group} · ${owner===null?'On the market':`Owned by ${seat(owner)}`}</p>${facts([['List price',money(t.price)],['Base rent',money(t.rent)],['Full district',money(t.rent*2)]])}`:`<p>${info[t.kind]}</p>`}`);
}
const summary=(deed,cash)=>[deed===null?'':rules.tiles[deed].name,cash?money(cash):''].filter(Boolean).join(' + ');
function facts(entries){
  return `<dl class="facts">${entries.map(([key,v])=>`<div><dt>${key}</dt><dd>${v}</dd></div>`).join('')}</dl>`;
}
function render() {
  const s = state, a = actingSeat(s), p = s.players[a], t = rules.tiles[s.players[s.turn].pos];
  const phaseNames={roll:'Navigation',offer:'Deed for sale',auction:'Live auction',trade:'Trade offer',end:'Settlement',over:'Final accounts'};
  document.body.dataset.phase=s.phase;
  $('phaseLabel').textContent=phaseNames[s.phase].toUpperCase();
  $('controlType').textContent=s.phase==='over'?'TABLE CLOSED':`${seat(a)} · ${seats[a]==='bot'?'Bot':'Local'}`;
  $('chartStatus').textContent=s.phase==='roll'?`${seat(a)} at ${t.name}`:s.phase==='auction'?`${t.name} · Auction in progress`:s.phase==='trade'?'Private negotiation':s.phase==='over'?'Port closed':`${s.dice.join(' + ')} → ${t.name}`;
  $('round').textContent = `ROUND ${String(s.round).padStart(2,'0')} / ${rules.rounds}`;
  for (const [i,tile] of rules.tiles.entries()) {
    let b = $(`tile-${i}`);
    if (!b) {
      b = document.createElement('button'); b.id=`tile-${i}`;
      const [row,col] = boardPosition(i);
      b.style.gridArea=`${row} / ${col}`;
      b.className='tile '+(tile.kind==='deed'?'deed':'special');
      b.style.setProperty('--band',bands[tile.group] || '#718373');
      b.onclick=()=>detail(i);
      $('board').append(b);
    }
    b.classList.toggle('landing',s.phase!=='over'&&i===s.players[s.turn].pos);
    const here=s.players.flatMap((player,j)=>player.pos===i&&!player.out?[j]:[]);
    b.innerHTML=`${tile.kind==='deed'?`<span class="num">Nº ${String(i).padStart(2,'0')}</span>`:`<span class="mark">${tile.mark}</span>`}<strong>${tile.name}</strong>${tile.price?`<span class="cost">${money(tile.price)}</span>`:''}${s.owners[i]!==null?`<span class="owned">●${s.owners[i]+1}</span>`:''}<span class="tokens">${here.map(j=>`<span class="token" style="background:${colors[j]}">${j+1}</span>`).join('')}</span>`;
    b.setAttribute('aria-label',`${tile.name}${here.length?', occupied by '+here.map(seat).join(', '):''}. Inspect space`);
  }
  $('register').innerHTML=s.players.map((player,i)=>{
    const owned=deeds(s,i), groups=Object.keys(bands).map(g=>{
      const count=owned.filter(k=>rules.tiles[k].group===g).length;
      return count?`<span title="${g}" style="--band:${bands[g]}">${g} ${count}/${rules.tiles.filter(t=>t.group===g).length}</span>`:'';
    }).join('');
    return `<div class="row"><span class="badge" style="background:${colors[i]}">${i+1}</span><div><strong>${seat(i)}</strong><div class="meta">${player.out?'Bankrupt':seats[i]==='bot'?'Bot':'Local player'} · ${owned.length} deeds</div><div class="holdings">${groups}</div></div><span class="money">${money(player.cash)}</span></div>`;
  }).join('');
  $('balances').innerHTML=s.players.map((v,i)=>`<div class="ledger"><i style="background:${colors[i]}"></i>${seat(i)}<b>${v.out?'Bankrupt':money(v.cash)}</b></div>`).join('');
  $('log').innerHTML=[...s.events].reverse().map(e=>`<li>${e}</li>`).join('');
  $('actions').replaceChildren();
  if(s.phase==='over'){
    $('turn').innerHTML=`<h2>${s.winners.map(seat).join(' & ')} ${s.winners.length>1?'tie':'wins'}</h2><p>Cash plus the list value of all deeds.</p>${facts(s.players.map((player,i)=>[seat(i),player.out?'Bankrupt':money(player.cash+deeds(s,i).reduce((sum,k)=>sum+rules.tiles[k].price,0))]))}`;
    const b=document.createElement('button'); b.className='primary';b.textContent=room?'Leave table':'Rematch';b.onclick=room?()=>endRoom('You left the table.'):()=>play([...seats],$('board').dataset.map,clockSeconds).catch(report);$('actions').append(b);
    return;
  }
  let title, text, stats=[];
  if(s.phase==='roll'){
    title=`${seat(a)}’s turn`;text=`${t.name} · ${money(p.cash)} available`;
  }else if(s.phase==='offer'){
    title=t.name;text=`${t.group} · Buy at list price or open the deed to every bidder.`;
    stats=[['List price',money(t.price)],['Base rent',money(t.rent)],['After buying',p.cash>=t.price?money(p.cash-t.price):'Short of cash']];
  }else if(s.phase==='auction'){
    title=t.name;text=`${s.auction.leader===null?'No bids yet.':seat(s.auction.leader)+' leads.'} ${clockSeconds?'Bid before the clock runs out or withdraw.':'Raise the bid or withdraw.'}`;
    stats=[['High bid',money(s.auction.high_bid)],['Your cash',money(p.cash)],['List / rent',`${money(t.price)} / ${money(t.rent)}`]];
  }else if(s.phase==='trade'){
    const d=s.trade;title=`Offer from ${seat(d.from)}`;text=`${seat(d.to)}, review both sides. Nothing changes hands unless you accept.`;
    stats=[['You receive',summary(d.give_deed,d.give_cash)],['You give',summary(d.take_deed,d.take_cash)]];
  }else{
    title=t.name;text=s.events.at(-1);
  }
  $('turn').innerHTML=`<h2>${title}</h2><p>${text}</p>${stats.length?facts(stats):''}`;
  if(seats[a]==='bot' || s.phase==='end') $('actions').innerHTML=`<small class="waiting">${s.phase==='end'?'Advancing to the next turn…':'Bot is considering the table…'}</small>`;
}
function initialize(types,map,seconds,seed) {
  rules=maps[map];clockSeconds=seconds;
  const side=rules.tiles.length/4+1;
  const board=$('board');
  board.querySelectorAll('.tile').forEach(tile=>tile.remove());
  board.style.gridTemplate=`repeat(${side},minmax(0,1fr)) / repeat(${side},minmax(0,1fr))`;
  board.querySelector('.ocean').style.gridArea=`2 / 2 / ${side} / ${side}`;
  board.dataset.map=map;
  $('mapTitle').textContent=$('boardName').textContent=map==='outer'?'Outer Harbor':'Inner Harbor';
  showView('board');
  seats=types;
  state=command({action:'start',rules,seats:types.length,seed});
}
async function play(types,map='compact',seconds=DEFAULT_CLOCK) {
  session?.abort(); session=new AbortController(); const {signal}=session;
  initialize(types,map,seconds,crypto.getRandomValues(new Uint32Array(1))[0]);
  while(!signal.aborted) {
    render();
    if(state.phase==='over') return;
    const step=new AbortController();
    const cancel=()=>step.abort();
    signal.addEventListener('abort',cancel,{once:true});
    const action=state.phase==='end'
      ? (await wait(950,step.signal),{action:'end',actor:state.turn})
      : await controllers[seats[actingSeat(state)]](state,step.signal);
    signal.removeEventListener('abort',cancel); step.abort();
    if(signal.aborted) return;
    state=command(action);
  }
}
function report(err){$('actions').replaceChildren();$('turn').textContent=`Game unavailable: ${err.message}`;console.error(err)}
function settings(){
  return `
    <label class="field">Board<select id="map"><option value="compact">Inner Harbor · 20 spaces</option><option value="outer">Outer Harbor · 28 spaces</option></select></label>
    <label class="field">Human bid clock<select id="clock"><option value="5" selected>5 seconds</option><option value="0">Untimed</option><option value="15">15 seconds</option><option value="30">30 seconds</option></select></label>`;
}
function showView(name){
  for(const tab of document.querySelectorAll('[data-view]')){
    const active=tab.dataset.view===name;tab.setAttribute('aria-pressed',String(active));$(tab.dataset.view+'View').hidden=!active;
  }
}
document.querySelector('.switcher').onclick=e=>{if(e.target.dataset.view)showView(e.target.dataset.view)};
function setup(){
  if(room){roomMenu();return}
  const fields=Array.from({length:4},(_,i)=>`<label class="field">${seat(i)}<select id="seat-${i}">${(i<2?['human','bot']:['off','human','bot']).map(v=>`<option value="${v}" ${v===(seats[i]??'off')?'selected':''}>${{human:'Local player',bot:'Bot',off:'Empty'}[v]}</option>`).join('')}</select></label>`).join('');
  openDialog(`<h2>New table</h2><p>Choose how to play. Starting replaces this match.</p>
    <div class="modeChoices"><button id="solo"><b>Solo</b><span>You + two bots</span></button><button id="passPlay"><b>Pass &amp; play</b><span>Two on this device</span></button><button id="host"><b>Host online</b><span>Invite devices</span></button><button id="join"><b>Join online</b><span>Enter table code</span></button></div>
    ${savedTableButton()}<details id="advanced"><summary>Custom local table</summary>${settings()}${fields}<button id="start" class="primary">Start game</button></details>`);
  bindSavedTableButton();
  const quick=types=>{$('modal').close();play(types,$('board').dataset.map,clockSeconds).catch(report)};
  $('solo').onclick=()=>quick(['human','bot','bot']);$('passPlay').onclick=()=>quick(['human','human']);
  $('host').onclick=hostRoom;$('join').onclick=()=>roomMenu(true);
  $('map').value=$('board').dataset.map;$('clock').value=String(clockSeconds);
  $('start').onclick=()=>{
    const types=[0,1,2,3].map(i=>$(`seat-${i}`).value).filter(v=>v!=='off');
    const map=$('map').value,seconds=Number($('clock').value);
    $('modal').close();play(types,map,seconds).catch(report);
  };
}
$('setupBtn').onclick=setup;
$('close').onclick=()=>$('modal').close();
$('modal').setAttribute('aria-label','Table information');
$('rulesBtn').onclick=()=>openDialog(`<h2>The rulebook</h2><p>Start with ${money(rules.cash)}. Roll two dice to move clockwise. Passing Port Office pays ${money(rules.salary)}.</p><h3>Buy or auction</h3><p>Buy a vacant deed at list price or send it to auction. Everyone, including the landing player, may bid. Raise by at least ${money(rules.auction_increment)} or withdraw. The last bidder pays their bid. Without a bid, the deed stays vacant.</p><h3>Negotiate before rolling</h3><p>Once per turn, propose a deed sale or swap. Either side may add cash; the other merchant can accept or decline. Owning a full district doubles its rent.</p><h3>Settle accounts</h3><p>If you cannot pay rent or a bill, your remaining cash is paid and your deeds return to market. Be the last solvent merchant, or finish round ${rules.rounds} with the greatest cash plus deed value. Ties share the win.</p>`);
try {
  const bytes=Uint8Array.from(atob($('binary').textContent),c=>c.charCodeAt(0));
  engine=(await WebAssembly.instantiate(bytes)).instance.exports;
  const initialGame=play(['human','bot','bot']);promptSavedTable();await initialGame;
} catch(err){report(err)}
