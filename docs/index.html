/* The casting cup uses the confirmed face as its front; the other five turn out of sight. */
.die,.strip .die,.diceSet:has(.die:nth-child(3)) .die,.strip .diceSet:has(.die:nth-child(3)) .die{
  --half:23.5px;position:relative;display:block;padding:0;border:0;background:transparent;box-shadow:none;perspective:250px
}
.strip .die,.diceSet:has(.die:nth-child(3)) .die{--half:14.5px}
.strip .diceSet:has(.die:nth-child(3)) .die{--half:9px}
.dieCube,.pipFace{position:absolute;inset:0;border-radius:inherit}
.dieCube{transform-style:preserve-3d;transform:translateZ(calc(-1 * var(--half)))}
.pipFace{display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);place-items:center;padding:11%;border:1px solid #fff4d1;
  backface-visibility:hidden;background:linear-gradient(135deg,#fff8df,#efd5a2);box-shadow:inset -1px -2px 0 #af8d56;transform:translateZ(var(--half))}
.pipFace.face0{box-shadow:inset -1px -2px 0 #ae8b54,0 2px 0 #ab874c}
.pipFace.face1{transform:rotateY(180deg) translateZ(var(--half))}
.pipFace.face2{transform:rotateX(90deg) translateZ(var(--half))}
.pipFace.face3{transform:rotateY(90deg) translateZ(var(--half))}
.pipFace.face4{transform:rotateX(-90deg) translateZ(var(--half))}
.pipFace.face5{transform:rotateY(-90deg) translateZ(var(--half))}
.pipFace:not(.face0){background:#e8c998}

.hasOwner .deedHead{inset:0 0 auto;align-items:center;justify-content:start;padding:0 2px;
  background:var(--owner-ink);color:white;box-shadow:0 1px 0 #fff8df,0 2px 0 #17232c;z-index:1}
.board .hasOwner:is(:focus-visible,.selected,[data-plot],[data-trade-tile]) .deedHead{inset-inline:3px}
.hasOwner .districtMark{order:1;margin-left:auto;color:white;background:none}
.hasOwner .deedFace{box-shadow:inset 4px 0 var(--owner-ink)}
.ownerMark{display:inline-flex;align-items:center;gap:2px;color:white;white-space:nowrap;
  font:750 10px/1 system-ui,sans-serif;font-variant-numeric:tabular-nums}
.ownerMark b{font:900 14px/1.08 system-ui,sans-serif;letter-spacing:-.04em}
.ownerMark span{font-weight:650}.ownerMark.complete span{font-weight:900;text-decoration:underline;text-underline-offset:1px}
.tile.deed .berth{position:relative}.board .tile.deed .berth .token{background:#fffae5;border-radius:4px}
.board .tile:is(:focus-visible,.selected) .deedHead{inset-inline:3px}
.board .tile.deed,.board[data-map] .tile.deed:has(.berth){padding-top:16px;gap:0}
.board:not(.route) .tile.deed:not(.fleetHere){padding-block:15px 3px}
.board:not(.route) .tile.deed.hasOwner:not(.fleetHere){padding-block:18px 4px}
.board.route .tile.deed .printName{display:block}.board.route .tile.deed .printCode{display:none}
.board.route .tile.deed.hasOwner{padding:0 0 2px;justify-content:flex-start}
.board.route .tile.deed.hasOwner .deedHead{position:relative;inset:auto;align-self:stretch;flex:none;min-height:16px}
.board.route .hasOwner .districtMark{white-space:normal;overflow-wrap:anywhere;text-align:right}
.board.route .hasOwner .deedLabel{margin-block:auto;padding-inline:2px}
.portSeal{overflow:hidden;background:var(--enamel,#294554);color:#fff3d2}
.portSeal svg{position:absolute;top:0;right:0;width:79%;height:100%;opacity:.18}
.tile[data-kind=guild]{--enamel:#284d3d}.tile[data-kind=exchange]{--enamel:#62481f}
.tile[data-kind=fee]{--enamel:#6e3c2a}.tile[data-kind=works]{--enamel:#2d5359}
.tile[data-kind=notice]{--enamel:#334e75}.tile[data-kind=rest]{--enamel:#4b5051}
.board[data-map] .tile.special .portLabel,.board[data-map] .tile.special .tileValue{color:#fff9e6}
.tile.special:is(.selected,.landing,:focus-visible,.located) .portSeal{inset:3px}
.tile.special:is([data-plot=off],[data-trade-tile=off]) .portSeal{background:#454e50}
.board.route .tile.special .station{color:#fff3d2}
.holdings>span{border:0;font:650 12px/1.4 system-ui;padding-left:0}.holdings .engraving{width:20px}
@media(min-width:1120px) and (max-height:800px){
  .board[data-map] .tile.deed:has(.berth){padding-top:13px;padding-bottom:1px}
  .board[data-map] .tile.deed.hasOwner:has(.berth){padding-top:17px}
  .board .tile.deed .berth,.board .tile.deed .berth .token{height:15px}
  .board .tile.deed.fleetHere strong{font-size:12px;line-height:1}
}
@media(min-width:1200px) and (max-height:740px){
  .board:not(.route) .fleetHere .deedHead{top:0}
  .board:not(.route) .fleetHere .ownerMark b{font-size:12px}
  .board:not(.route) .fleetHere .tileValue{line-height:1}
  .board:not(.route) .tile.deed.fleetHere strong{font-size:11px;line-height:1}
  .board:not(.route) .tile.deed .berth,.board:not(.route) .tile.deed .berth .token{height:12px}
}
.board:not(.route) .ocean{contain:size}
.board:not(.route) .tile.deed.hasOwner:has(.berth){padding-block:17px 0}
@media(min-width:1120px){
  body:not([data-trade]) .layout .boardbox .board.route{grid-template:none / repeat(var(--fold-columns),minmax(0,1fr))!important;grid-auto-rows:minmax(74px,1fr)}
  .board.route .tile.deed .station{top:2px;left:auto;right:2px;font-size:9px;color:var(--ink);background:var(--stock)}
  .board.route .tile.deed:has(.station) strong{padding-inline:1px}
}
@media(forced-colors:active){
  .engraving{forced-color-adjust:none}
  .deedFace{forced-color-adjust:none}
  .ownerMark{outline:1px solid CanvasText}
  .deedLabel,.portLabel{color:ButtonText;background:ButtonFace;text-shadow:none}
}
.deckGuide{margin-top:9px;color:#192e34}
.deckGuide h3{margin:0;font:700 18px/1.2 Georgia,serif}
.deckGuide dl{margin:8px 0}
.deckGuide dl>div{display:grid;grid-template-columns:minmax(0, .86fr) minmax(0, 1.14fr);gap:8px;border-top:1px solid #a79877;padding:5px 0;font:13px/1.3 system-ui}
.deckGuide dt{font-weight:750}.deckGuide dd{margin:0}
.phoneBoardField{display:none}
#jailRentField[hidden]{display:none}
#boardGlance{display:none}
/* The seats and dice have separate sightlines; the last transfer stays below the action. */
.board:is(:not(.route),.mobileLoop) .ocean{
  grid-template: auto minmax(0,1fr) auto / repeat(2,minmax(0,1fr));
}
.board:is(:not(.route),.mobileLoop) #boardGlance{display:contents}
#boardGlance>div{position:relative;z-index:1;min-width:0;max-width:100%;color:#fff6dc;font-variant-numeric:tabular-nums}
#boardGlance>div>span{display:block;font:750 11px/1.45 system-ui;letter-spacing:.07em;text-transform:uppercase}
#boardGlance strong{display:block;font:700 clamp(20px,2.4vw,33px)/1.3 Georgia,serif;overflow-wrap:anywhere}
#boardGlance small{display:block;font:650 13px/1.5 system-ui;letter-spacing:0}
.turnWell{grid-area:1/1;justify-self:start;align-self:start;text-align:left;padding:6px 23px 6px 13px;transform-origin:4px 12px;
  filter:drop-shadow(0 2px 1px #102227aa)}
.turnWell::before{content:"";position:absolute;inset:0;z-index:-1;border-left:4px ridge #ebc67a;
  background:linear-gradient(100deg,#0003,transparent 20% 76%,#0003),var(--flag-ink);
  clip-path:polygon(0 0,100% 0,calc(100% - 10px) 50%,100% 100%,0 100%);box-shadow:inset 0 3px #fff3,inset 0 -3px #0003}
.turnWell::after{content:"";position:absolute;left:6px;top:5px;bottom:5px;border-left:1px dashed #fff7}
.rollWell{grid-area:1/2;justify-self:end;align-self:start;padding:5px 12px 6px;text-align:center;
  background:linear-gradient(#193d3e,#102c32);border:1px solid #bf9a62;border-radius:12px;
  box-shadow:inset 0 0 0 3px #253632,inset 0 0 0 4px #e6ce922f,0 2px 2px #14272b}
.rollWell>span{color:#f1d99c}.castLine,#wellFaces,.ticketLine{display:flex;align-items:center;justify-content:center;gap:6px}
#wellFaces[hidden]{display:none}#wellFaces{gap:3px}
.castLine:has(#wellFaces:not([hidden])) strong::before{content:"=";margin-right:.24em;color:#e9d4ab;font:650 .6em/1 system-ui;vertical-align:.12em}
#wellFaces svg{display:block;width:clamp(18px,2vw,27px);height:auto;background:linear-gradient(135deg,#ffffed,#eed9aa);
  border:1px solid #fff8d8;border-radius:22%;box-shadow:0 2px #9e754c,0 3px 2px #0007;fill:#203837}
#wellRoller{color:#ece4cd}
.cashWell{grid-area:3/1/4/-1;justify-self:center;text-align:center;padding:5px 18px 6px;isolation:isolate;
  filter:drop-shadow(0 2px 2px #152924aa)}
.cashWell::before{content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(110deg,#f5e7c5,#fffae8 60%,#f0dfba);border-block:3px double #9a815b;
  mask:radial-gradient(circle at 0 50%,transparent 2px,#000 2.5px) left/51% 9px repeat-y,radial-gradient(circle at 100% 50%,transparent 2px,#000 2.5px) right/51% 9px repeat-y}
#boardGlance .cashWell{color:#213c39}
#wellCashLabel{color:#685032}#wellRoute{color:#3a4845}.ticketLine{gap:0 10px;flex-wrap:wrap}
#boardGlance #wellCash:has(.ticketEntry){display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px 14px;text-align:left;font:550 14px/1.5 system-ui}
.ticketEntry b{font-weight:750}
#wellCashNote:not(:empty){border-top:1px dashed #ab9978}
.board:is(:not(.route),.mobileLoop) .ocean>:is(#stage,#tradeGuide,#plotGuide){grid-area:2/1/3/-1}
.boardbox:has(.board:is(:not(.route),.mobileLoop)) #stage[data-kind=roll] .stageFace{display:block;text-align:center;min-height:0;padding:8px 12px}
.board:not(.route) .ocean #stage[data-kind=roll]:not(:has(#dispatchCard)){width:fit-content;max-width:90%;padding-inline:12px}
.boardbox:has(.board:is(:not(.route),.mobileLoop)) #stage[data-kind=roll] #stageProp{display:none}
.boardbox:has(.board:is(:not(.route),.mobileLoop)) #stage[data-kind=roll] #stageTag{display:none}
.boardbox:has(.board:is(:not(.route),.mobileLoop)) #stage[data-live=roll][data-rent] #stageDetail{display:none}
.boardbox:has(.board:is(:not(.route),.mobileLoop)) #stage[data-kind=dispatch]:has(#dispatchCard) .stageFace{display:none}
.board.mobileLoop .cashWell{grid-row:2;align-self:start;margin-top:8px}
@media(max-width:800px){
  #boardGlance>div>span{font-size:10px}
  #boardGlance strong{font-size:19px}
  #boardGlance small{font-size:12px}
  .turnWell{padding:5px 13px 5px 9px}.turnWell::before{clip-path:polygon(0 0,100% 0,calc(100% - 6px) 50%,100% 100%,0 100%)}
  .rollWell{padding:3px 7px 4px}.castLine{gap:4px}.cashWell{padding:4px 11px}
  #boardGlance #wellCash:has(.ticketEntry){font-size:12px;column-gap:8px}
}
@media(max-width:800px) and (max-height:740px){
  .boardbox:has(.mobileLoop) #dispatchCard{margin:0;padding:4px 8px}
  .boardbox:has(.mobileLoop) #dispatchCard :is(.dispatchMast,.dispatchPostage){display:none}
  .boardbox:has(.mobileLoop) #dispatchCard .dispatchLetter{padding:3px 0}
  .boardbox:has(.mobileLoop) #dispatchTitle{font-size:20px}
}
@media(max-width:800px){
  .phoneBoardField{display:block}
  .layout .boardbox .board.mobileLoop{
    grid-template:repeat(var(--ring-rows),minmax(44px,1fr)) / repeat(var(--ring-cols),minmax(24px,1fr))!important;
    min-width:calc(var(--ring-cols)*25px + 3px);gap:1px
  }
  .board.mobileLoop .tile,.board.mobileLoop[data-density=dense] .tile{
    grid-area:var(--ring-row) / var(--ring-col)!important;min-height:44px;padding:0;justify-content:center
  }
  .board.mobileLoop .ocean,.board.mobileLoop .ocean:has(#mobileLadder:not(:empty)){
    display:grid;grid-area:2 / 2 / var(--ring-rows) / var(--ring-cols)!important
  }
  .board.mobileLoop #mobileLadder,.board.mobileLoop .foldArrow,.board.mobileLoop .deedLabel,
  .board.mobileLoop .portLabel,.board.mobileLoop .districtMark,.board.mobileLoop .ownerMark span{display:none}
  .board.route.mobileLoop .tile .station{
    display:block;position:static;color:#172634;background:#fff4d8;padding:0 2px;
    font:750 12px/1.15 system-ui;font-variant-numeric:tabular-nums
  }
  .board.mobileLoop .tile.special .station{color:#fff9e6;background:#263d49}
  .board.mobileLoop .tile.hasOwner .deedHead{min-height:0;justify-content:center}
  .board.mobileLoop .ownerMark b{font-size:10px}
  .board.mobileLoop .tile .berth{height:14px}
  .board.mobileLoop .tile .berth .token{height:14px;max-width:18px}
  .board.mobileLoop .tile .berth[data-ships="3"],.board.mobileLoop .tile .berth[data-ships="4"]{height:auto;flex-wrap:wrap}
  .board.mobileLoop .tile .berth:is([data-ships="3"],[data-ships="4"]) .token{flex:0 1 48%;max-width:13px}
}

<body>
<header><div class="mast"><span class="seal" aria-hidden="true">⚓</span><strong>Harbor Deeds</strong></div><div class="headright"><span class="live">Local table</span><button id="soundBtn" aria-label="Sound effects" aria-pressed="false">♪ Off</button><button id="prefsBtn" aria-label="Display settings" title="Display settings">⚙<span> Display</span></button><button id="rulesBtn" aria-label="Rulebook">?</button><button id="setupBtn">New table</button></div></header>
<main><section class="treasury" aria-label="All player balances and ship positions"><strong>Fleet<br>station</strong><div id="stageLedger"></div></section>
<div class="layout"><section class="boardbox" id="boardView" aria-label="Game board"><div class="boardhead"><strong id="mapTitle"></strong><small id="round"></small></div><div class="board" id="board">

function value(s, rules, i, who) {

    const marginal=(others+1)*fares[others]-others*(others?fares[others-1]:0);
    const turns=s.players.reduce((n,p,k)=>n+(k===who||p.out?0:Math.max(0,futureTurns(s,rules,k))),0);

export function botMove(s, rules) {
  const actor = actingSeat(s), cash = s.players[actor].cash;
  const reserve = Math.min(rules.salary, cash / 3);
  const step = rules.auction_increment;
  // In a duel, a collected dollar can also cost the only rival a dollar.
  // Credit that second dollar only for rent not already covered by their guild.
  const duelRival=s.players.length===2?s.players[1-actor]:null;
  const rentWeight=duelRival&&!duelRival.cover?2:1;
  const send = (action, extra = {}) => ({action, actor, ...extra});
  if(s.phase==='roll'&&s.players[actor].in_prison&&s.players[actor].pardons)return send('pardon');
  if(s.phase==='debt'){
    const need=s.debt.remaining;
    // Cover with the smallest sufficient lot, or make the largest partial
    // payment. Prefer shedding a level to a whole deed at an equal price.
    const options=[...s.salvages.map(q=>({...q,action:'salvage'})),...s.sells.map(q=>({...q,action:'sell'}))];
    options.sort((a,b)=>Math.min(b.price,need)-Math.min(a.price,need)||a.price-b.price);
    return options.length?send(options[0].action,{tile:options[0].tile}):send('bankrupt');
  }
  if(s.phase==='works'){
    const best=s.commissions.filter(q=>q.cost<=cash-reserve)
      .map(q=>({q,net:rentWeight*traffic(q.tile,s,rules,true)*q.gain-q.cost})).sort((a,b)=>b.net-a.net)[0];
    return best?.net>0?send('commission',{tile:best.q.tile}):send('skip');
  }
  if(s.phase==='guild'){
    const p=s.players[actor],t=rules.tiles[p.pos],turns=futureTurns(s,rules);
    const exposed=s.rents.filter((_,k)=>s.owners[k]!==null&&s.owners[k]!==actor);
    const benefit=exposed.reduce((sum,r)=>sum+Math.max(0,Math.min(t.cover_offer,r)-Math.min(p.cover,r)),0);
    return send(exposed.length && (1-(1-exposed.length/rules.tiles.length)**turns)*benefit/exposed.length>t.cash_offer?'insure':'grant');
  }
  if (s.phase === 'offer') {
    const tile = rules.tiles[s.players[actor].pos];
    // If rivals cannot meet the list price, try buying it cheaper at auction.
    const rival = Math.max(...s.players.map((p,i) => i === actor || p.out ? 0 : p.cash));
    return send(tile.price <= cash - reserve && (rules.auction_declined===false||rival >= tile.price) ? 'buy' : 'pass');
  }
  if (s.phase === 'auction') {
    const {tile, high_bid} = s.auction;
    const ceiling = Math.min(value(s,rules,tile,actor), cash - reserve);
    const next = Math.max(high_bid + step, Math.floor((high_bid + (ceiling - high_bid) * 0.55) / step) * step);
    return ceiling < high_bid + step ? send('withdraw') : send('bid', {amount:Math.min(next,Math.floor(ceiling / step) * step)});
  }
  if (s.phase === 'trade') {
    const t = s.trade;
    const benefit = t.give_cash + (t.give_deed === null ? 0 : value(s,rules,t.give_deed,actor));
    const cost = t.take_cash + (t.take_deed === null ? 0 : value(s,rules,t.take_deed,actor));
    return send(benefit >= cost && cash - t.take_cash >= reserve ? 'accept' : 'reject');
  }
  if(s.phase==='roll' && !rules.liquidation?.deeds){
    const q=rescueSale(s,rules);
    if(q)return send('sell',{tile:q.tile});
  }
  if (s.phase === 'roll' && !s.traded) {
    // Seek mutually valuable acquisitions rather than sending speculative offers every turn.
    const deals = s.owners.flatMap((to, i) => {
      if (to === null || to === actor || locked(s,rules,i)) return [];
      const max = value(s,rules,i,actor), min = value(s,rules,i,to);
      const give_cash = Math.ceil((max+min)/2);

    }).sort((a,b) => b.margin-a.margin);

      const {to,i,give_cash}=deals[0];

    }

          if(!authenticated)throw Error('Unverified host');
          if(msg.kind==='ended'){finishRoom(r,'The host or a device deliberately ended the table.',{forget:true});return}
          if(msg.kind==='start'&&!r.started&&Number.isSafeInteger(msg.count)&&msg.count>=0){
            r.count=msg.count;startNetwork(r,msg.config);
          }else if(msg.kind==='replay'&&r.count!==undefined&&Array.isArray(msg.moves)&&msg.moves.length<=40){

          }else if(msg.kind==='caughtUp'&&msg.seq===r.seq&&r.count===r.seq){
            delete r.count;clearTimeout(r.timeout);link.send({kind:'ready',seq:r.seq});
          }else if(msg.kind==='status'&&r.started&&msg.seq===r.seq&&Array.isArray(msg.missing)&&Number.isFinite(msg.remaining)){

          }else if(msg.kind==='commit'&&r.started&&msg.seq===r.seq+1){
            const before=state;replay(r,msg.move);r.remaining=r.seconds*1000;r.deadline=0;networkStep(r);liveFeedback(msg.move,before,state);
          }else if(msg.kind==='reject'&&msg.seq===r.seq){r.remaining=remaining(r);networkStep(r)}

        }catch(e){fail(`Could not synchronize: ${e.message}`)}

    });
    r.peer.on('connection',link=>{
      if(!host){link.close();return}
      let id,challenge;
      const deny=()=>{link.send({kind:'closed'});setTimeout(()=>link.close(),150)};
      const handshake=setTimeout(()=>{if(!id)link.close()},15000);
      link.on('data',async msg=>{
        if(room!==r)return;
        if(!id){
          if(msg?.kind==='join'&&!r.started&&r.links.size<3){
            id=[1,2,3].find(i=>!r.links.has(i));r.links.set(id,link);r.keys[id]=randomHex();
            const available=r.slots.findIndex(v=>v===-1||v===-2);if(available!==-1)r.slots[available]=id;

          }
          if(msg?.kind==='hello'&&!challenge&&r.started&&[1,2,3].includes(msg.id)&&validKey(msg.nonce)&&r.owners.includes(msg.id)&&!r.links.has(msg.id)){
            const n=randomHex(),args=[code,msg.id,msg.nonce,n];

          }
          if(msg?.kind==='proof'&&validKey(msg.mac)&&msg.mac===challenge?.expected&&!r.links.has(challenge.id)){
            id=challenge.id;r.links.set(id,link);clearTimeout(handshake);sendReplay(r,link);return;
          }
          deny();return;
        }
        if(r.links.get(id)!==link)return;
        if(!r.started){if(msg?.kind==='enrolled'&&!r.enrolled.has(id)){r.enrolled.add(id);hostLobby(r)}return}
        if(msg?.kind==='leave'){finishRoom(r,`Device ${id} deliberately left the table.`,{forget:true,notify:true});return}
        if(msg?.kind==='ready'&&msg.seq===r.seq&&!r.synced.has(id)){r.synced.add(id);hostStatus(r);return}
        if(msg?.kind==='intent'&&msg.seq===r.seq&&!r.missing.length)acceptMove(r,id,msg.move);
      });
      const lost=()=>{
        clearTimeout(handshake);if(room!==r||r.links.get(id)!==link)return;
        r.links.delete(id);
        if(r.started){r.synced.delete(id);hostStatus(r);return}
        delete r.keys[id];r.enrolled.delete(id);
        r.slots=r.slots.map((v,i)=>v===id?(i<2?-1:-2):v);hostLobby(r);
      };

}
function broadcast(r,msg){for(const link of r.links.values())link.send(msg)}
function startNetwork(r,c){

  if(!c||!boardFor(edition,c.map)||(usesCharter(edition)?!validCharter(c.charter):c.charter!==undefined)||!(c.policy===undefined||['even','district','free'].includes(c.policy))||![0,5,15,30].includes(c.seconds)||
     !Number.isInteger(c.seed)||c.seed<0||c.seed>0xffffffff||!Array.isArray(c.owners)||
     c.owners.length<2||c.owners.length>4||!c.owners.every(n=>[-1,0,1,2,3].includes(n))||
     (!r.host&&!c.owners.includes(r.device)))throw Error('Invalid host settings');
  r.started=true;r.owners=c.owners;r.seconds=c.seconds;r.remaining=c.seconds*1000;
  initialize(c.owners.map(n=>n<0?'bot':'human'),c.map,c.seconds,c.seed,c.policy,edition,c.charter);

function replay(r,move){
  if(!(playable.has(move?.action)||move?.action==='end'))throw Error('Invalid journal command');
  state=command(move);r.seq++;
}
function commit(r,move){
  const before=state;state=command(move);
  r.save.journal.push(move);r.save.remaining=r.remaining=r.seconds*1000;r.deadline=0;
  // A move becomes visible to players only after the atomic storage write succeeds.
  try{persist(r)}catch{finishRoom(r,'Move not recorded. Free browser storage and rehost the last saved turn.');return}
  r.seq++;
  broadcast(r,{kind:'commit',seq:r.seq,move});
  networkStep(r);
  liveFeedback(move,before,state);
}
function acceptMove(r,device,move){
  const actor=actingSeat(state);
  if(r.missing.length||!playable.has(move?.action)||move.actor!==actor||r.owners[actor]!==device||state.phase==='over'||state.phase==='end')return;
  const fields=move.action==='propose'?['to','give_deed','take_deed','give_cash','take_cash']:move.action==='bid'?['amount']:['build','sell','commission','salvage'].includes(move.action)?['tile']:[];
  if(fields.some(k=>!Number.isSafeInteger(move[k])&&!(k.endsWith('_deed')&&move[k]===null))){
    r.links.get(device)?.send({kind:'reject',seq:r.seq});return;
  }
  move=Object.fromEntries(['action','actor',...fields].map(k=>[k,move[k]]));
  if(r.deadline&&performance.now()>=r.deadline){commit(r,{action:'withdraw',actor});return}
  try{commit(r,move)}catch(e){
    if(device>0)r.links.get(device)?.send({kind:'reject',seq:r.seq});
    else {r.remaining=remaining(r);networkStep(r)}

}
function networkStep(r){
  r.step?.abort();r.step=new AbortController();
  const {signal}=r.step,seq=r.seq,actor=actingSeat(state),owner=r.owners[actor];
  render();r.deadline=0;
  if(state.phase==='over')return;
  const deviceName=n=>n<0?'Bot':n===r.device?'This device':n===0?'Host':`Device ${n}`;
  $('controlType').textContent=`${seat(actor)} · ${deviceName(owner)}`;
  const timed=state.phase==='auction'&&clockSeconds&&owner>=0;
  if(r.missing.length){
    $('actions').textContent=`Table paused · Waiting for ${r.missing.map(n=>'Device '+n).join(', ')} to rejoin from the original browser.`;
    if(timed){
      const meter=makeBidMeter('Host bid clock',clockSeconds*1000);
      $('actions').prepend(meter.element);meter.update(r.remaining,true);
    }
    return;
  }
  if(r.leaving){$('actions').textContent='Waiting for leave confirmation…';return}
  if(state.phase==='end'||owner===-1){
    if(r.host)wait(state.phase==='end'?950:850,signal).then(()=>{
      if(!signal.aborted)commit(r,state.phase==='end'?{action:'end',actor:state.turn}:botMove(state,rules));
    });
    return;
  }
  if(owner===r.device){
    controllers.human(state,signal).then(move=>{
      if(!move||signal.aborted)return;
      if(r.host)acceptMove(r,0,move);
      else {r.link.send({kind:'intent',seq,move});$('actions').textContent='Waiting for host…'}
    });
  }else $('actions').textContent=`Waiting for ${deviceName(owner)}…`;
  if(timed){
    r.deadline=performance.now()+r.remaining;
    const meter=makeBidMeter('Host bid clock',clockSeconds*1000);$('actions').prepend(meter.element);
    const tick=()=>{
      const ms=r.deadline-performance.now();
      meter.update(ms);
      if(r.host&&ms<=0)commit(r,{action:'withdraw',actor});
    };
    const timer=setInterval(tick,100);signal.addEventListener('abort',()=>clearInterval(timer),{once:true});tick();
  }
  window.addEventListener('pagehide',()=>{
    const r=room;if(!r)return;
    if(r.host&&r.started&&r.hasSave&&r.deadline){
      r.save.remaining=remaining(r);try{persist(r)}catch{/* previous journal remains intact */}
    }
    room=null;r.step?.abort();clearTimeout(r.timeout);r.peer?.destroy();r.unlock?.();
  });
  window.addEventListener('pageshow',e=>{if(e.persisted&&!room&&$('setupBtn').textContent==='Network table')location.reload()});
}

      d.take_cash=Math.min(Math.max(0,-diff),s.players[to].cash,2147483647-s.players[d.from].cash);
      if((give===null&&!d.give_cash)||(take===null&&!d.take_cash))continue;

      // partial sets. Don't dismantle a complete district for ordinary progress.

function command(input) {
  const bytes = new TextEncoder().encode(JSON.stringify(input));
  const ptr = engine.reserve(bytes.length);
  new Uint8Array(engine.memory.buffer, ptr, bytes.length).set(bytes);
  const out = engine.dispatch();
  const result = JSON.parse(new TextDecoder().decode(new Uint8Array(engine.memory.buffer, out, engine.length())));

  recordGlance(input,state,result);

  return result;
}

const maxOpeningCash=1000000;
const hasJail=r=>r.prison_entry!=null||r.doubles_limit!=null||r.bail_cost!=null;
const charterOf=r=>({victory:r.victory??'net_worth',rounds:r.rounds,deeds:r.liquidation?.deeds??false,improvements:r.liquidation?.improvements??false,cash:r.cash,forceAuction:r.auction_declined!==false,jailRent:r.collect_rent_in_jail!==false});
const validCharter=c=>c&&['net_worth','elimination'].includes(c.victory)&&Number.isSafeInteger(c.rounds)&&c.rounds>=1&&c.rounds<=200&&typeof c.deeds==='boolean'&&typeof c.improvements==='boolean'&&
  (c.cash===undefined||Number.isSafeInteger(c.cash)&&c.cash>=1&&c.cash<=maxOpeningCash)&&(c.forceAuction===undefined||typeof c.forceAuction==='boolean')&&(c.jailRent===undefined||typeof c.jailRent==='boolean');
function boardControls(initial,onChange=()=>{}){
  const map=$('map');
  for(const [id,b] of Object.entries(catalog.boards))
    map.add(new Option(`${b.label} · ${b.rules.tiles.length} spaces`,id));
  map.value=initial.map;
  $('clock').value=String(initial.seconds);
  const chosen=()=>({map:map.value,policy:$('policy').value,seconds:Number($('clock').value),
    charter:{victory:$('victory').value,rounds:$('roundLimit').valueAsNumber,deeds:$('debtDeeds').checked,improvements:$('debtLevels').checked,cash:$('openingCash').valueAsNumber,forceAuction:$('forceAuction').checked,jailRent:$('jailRent').checked}});
  const changed=()=>{
    $('auctionHelp').textContent=$('forceAuction').checked?'Buy at list price or start an auction. Bidders may still withdraw.':'Declining leaves the deed on the market without an auction.';
    $('roundField').hidden=$('victory').value==='elimination';onChange(chosen());
  };
  const selectBoard=({policy,charter}={})=>{
    const base=catalog.boards[map.value].rules,c=charter??charterOf(base);
    $('policy').value=policy??base.development.policy;
    $('openingCash').value=c.cash??base.cash;$('forceAuction').checked=c.forceAuction??(base.auction_declined!==false);
    $('jailRentField').hidden=!hasJail(base);$('jailRent').checked=c.jailRent??(base.collect_rent_in_jail!==false);
    $('victory').value=c.victory;$('roundLimit').value=c.rounds;$('debtDeeds').checked=c.deeds;$('debtLevels').checked=c.improvements;
    changed();
  };
  map.onchange=()=>selectBoard();
  for(const id of ['policy','clock','victory','debtDeeds','debtLevels','forceAuction','jailRent'])$(id).onchange=changed;
  $('roundLimit').oninput=$('openingCash').oninput=changed;
  selectBoard(initial);
  return ()=>{
    if($('victory').value==='elimination'&&!$('roundLimit').validity.valid){
      $('roundLimit').value=catalog.boards[map.value].rules.rounds;changed();
    }
    const choice=chosen();
    if(!$('openingCash').reportValidity()||!$('roundLimit').reportValidity()||!validCharter(choice.charter))return null;
    return choice;
  };
}
function settings(){
  return `<label class="field">Board<select id="map"></select></label>
    <fieldset class="charter"><legend>Cash &amp; auctions</legend>
    <label class="field">Starting cash per player ($)<input id="openingCash" type="number" min="1" max="${maxOpeningCash}" step="1" inputmode="numeric" required></label>
    <label><input type="checkbox" id="forceAuction" aria-describedby="auctionHelp"> Force auctions on declined deeds</label>
    <p id="auctionHelp">Buy at list price or start an auction. Bidders may still withdraw.</p>
    <label id="jailRentField"><input type="checkbox" id="jailRent"> Owners collect rent while in jail</label></fieldset>
    <fieldset class="charter"><legend>Victory &amp; bankruptcy</legend><label class="field">Win by<select id="victory"><option value="net_worth">Net worth at round limit</option><option value="elimination">Last solvent merchant</option></select></label>
    <label class="field" id="roundField">Round limit<input type="number" id="roundLimit" min="1" max="200" step="1" required></label>
    <p>To cover a bill, allow the debtor to sell:</p><label><input id="debtDeeds" type="checkbox"> Undeveloped deeds</label><label><input id="debtLevels" type="checkbox"> Improvement levels</label></fieldset>
    <label class="field">Improvements<select id="policy"><option value="even">Even building</option><option value="free">Unrestricted</option><option value="district">Whole district</option></select></label>
    <label class="field">Human bid clock<select id="clock"><option value="5" selected>5 seconds</option><option value="0">Untimed</option><option value="15">15 seconds</option><option value="30">30 seconds</option></select></label>`;
}
function showView(name){
  if(plotDesk&&name!=='board')closePlots();
  document.body.dataset.instrument=name;
  for(const tab of document.querySelectorAll('[data-view]')){
    const active=tab.dataset.view===name;tab.setAttribute('aria-pressed',String(active));
    $(tab.dataset.view+'View').hidden=!active&&!(desktop.matches&&tab.dataset.view==='board');
  }
  $('inspector').hidden=!desktop.matches||name!=='board';
  document.querySelector('[data-view=board]').textContent=desktop.matches?'Space':'Board';
}
desktop.addEventListener('change',()=>showView(document.querySelector('[data-view][aria-pressed=true]').dataset.view));
$('register').onclick=e=>{const b=e.target.closest('[data-deed]');if(b)detail(+b.dataset.deed)};
$('stageLedger').onclick=e=>{
  const b=e.target.closest('[data-locate]');if(!b)return;
  const i=state.players[+b.dataset.locate].pos;
  showView('board');followTile(i);
  $('board').querySelector('.located')?.classList.remove('located');
  $(`tile-${i}`).classList.add('located');
};
document.querySelector('.switcher').onclick=e=>{if(e.target.dataset.view)showView(e.target.dataset.view)};
document.addEventListener('keydown',e=>{
  if($('modal').open||e.repeat||e.isComposing||e.altKey||e.ctrlKey||e.metaKey)return;
  if(tradeMap){tradeKey(e);return}
  if(e.target.matches('input,textarea,select,[contenteditable=true]'))return;
  if(plotDesk&&e.key==='Escape'){e.preventDefault();closePlots(true);return}
  if(!desktop.matches)return;
  const key=e.key.toUpperCase(),view={B:'board',F:'players',L:'activity'}[key];
  if(plotAccess?.s.phase==='roll'&&['I','S'].includes(key)){
    e.preventDefault();openPlots(key==='I'?'build':'sell');return;
  }
  const control=view?document.querySelector(`[data-view="${view}"]`):key==='?'?$('rulesBtn'):!plotDesk&&/^[RT]$/.test(key)?document.querySelector(`#actions [data-key="${key}"]:enabled`):null;
  if(control){e.preventDefault();control.click()}
});
function setup(){
  if(room){roomMenu();return}
  const fields=Array.from({length:4},(_,i)=>`<label class="field">${seat(i)}<select id="seat-${i}">${(i<2?['human','bot']:['off','human','bot']).map(v=>`<option value="${v}" ${v===(seats[i]??'off')?'selected':''}>${{human:'Local player',bot:'Bot',off:'Empty'}[v]}</option>`).join('')}</select></label>`).join('');
  openDialog(`<h2>New table</h2><p>Choose how to play. Starting replaces this match.</p>
    <div class="modeChoices"><button id="solo"><b>Solo</b><span>You + two bots</span></button><button id="passPlay"><b>Pass &amp; play</b><span>Two on this device</span></button><button id="host"><b>Host online</b><span>Invite devices</span></button><button id="join"><b>Join online</b><span>Enter table code</span></button></div>
    ${savedTableButton()}<details id="advanced"><summary>Custom local table</summary>${settings()}${fields}<button id="start" class="primary">Start game</button></details>`);
  bindSavedTableButton();
  const quick=types=>{$('modal').close();play(types,$('board').dataset.map,clockSeconds,rules.development.policy,charterOf(rules)).catch(report)};
  $('solo').onclick=()=>quick(['human','bot','bot']);$('passPlay').onclick=()=>quick(['human','human']);
  $('host').onclick=hostRoom;$('join').onclick=()=>roomMenu(true);
  const chosen=boardControls({map:$('board').dataset.map,seconds:clockSeconds,policy:rules.development.policy,charter:charterOf(rules)});
  $('start').onclick=()=>{
    const types=[0,1,2,3].map(i=>$(`seat-${i}`).value).filter(v=>v!=='off');
    const choice=chosen();if(!choice)return;
    const {map,seconds,policy,charter}=choice;
    $('modal').close();play(types,map,seconds,policy,charter).catch(report);
  };
}
$('setupBtn').onclick=setup;
$('close').onclick=()=>$('modal').close();
$('modal').setAttribute('aria-label','Table information');
$('rulesBtn').onclick=()=>openDialog(`<h2>The rulebook</h2><h3>How to win this table</h3><p>${rules.victory==='elimination'?'Be the last solvent merchant. There is no round limit.':`Have the most cash plus printed deed value after ${rules.rounds} rounds, or be the last solvent merchant. Equal net worth shares the win.`}</p><p>Start with ${money(rules.cash)}. Passing ${rules.tiles[0].name} pays ${money(rules.salary)}${rules.salary_land!=null?`; landing there pays ${money(rules.salary_land)} instead`:''}. Paying a bill down to exactly $0 is safe.</p><h3>Debt &amp; bankruptcy</h3><p>${rules.liquidation?.deeds||rules.liquidation?.improvements?`Cash goes to the creditor first. To cover the shortfall you may sell ${[rules.liquidation.deeds?'undeveloped deeds':'',rules.liquidation.improvements?`improvement levels at ${rules.liquidation.improvement_rate_pct}% of their build cost`:'' ].filter(Boolean).join(' and ')}. You can instead declare bankruptcy even if a sale would save you. With no permitted assets left, bankruptcy is automatic.`:'Emergency sales are disabled. An unpaid bill eliminates the debtor and returns their deeds to the bank.'}</p><h3>Buy or pass</h3><p>${rules.auction_declined===false?'Buy at list price or leave the deed on the market. No auction opens.':`Buy at list price or auction the deed to all players. Raise by at least ${money(rules.auction_increment)} or withdraw. No bids leaves the deed on the market.`}</p>${rules.doubles_limit?`<h3>Doubles</h3><p>Roll again on doubles. ${rules.doubles_limit} consecutive doubles send you to prison; doubles that free you do not earn another roll.</p>`:''}<h3>Negotiate before rolling</h3><p>Once per turn, propose a deed sale or swap. Either side may add cash; the other merchant can accept or decline.</p>`);
try {
  initFeedback();
  $('rulesBtn').addEventListener('click',()=>{
    if(hasJail(rules))$('content').insertAdjacentHTML('beforeend',`<h3>Rent while in jail</h3><p>${rules.collect_rent_in_jail===false?'Landing on a jailed owner’s deed is rent-free until the owner is released.':'Owners collect rent normally while in jail.'} Just visiting does not count as detention.</p>`);
    $('content').insertAdjacentHTML('beforeend','<h3>Reading a deed</h3><p>Matching prints belong to the same district. Select a deed for the full district name and its members. S1 2/3 means Seat 1 owns two of three deeds; SET means the whole district. Ships mark visitors, not owners.</p>');
    $('content').insertAdjacentHTML('afterbegin','<p class="keyGuide"><b>Desktop keys</b> &nbsp; R Roll · T Draft trade · I Improve · S Sell quote · B Space · F Players · L Activity · ← → browse focused spaces · Esc close sheet</p>');
    $('content').insertAdjacentHTML('beforeend',`<h3>Manage deeds on the board</h3><p>Before rolling, select a marked deed or choose Manage deeds. Switch between Improve and Sell to compare your options. Selecting a space only previews it; Confirm is a separate action. ${bankTerms()} Player trades leave the original bank acquisition price unchanged. Permanently developed districts cannot be sold.</p>${rules.tiles.some(t=>t.kind==='works')?'<h3>Public works</h3><p>Land at a works with an eligible deed to commission a one-use rent bonus. It pays only on the next rival rent. No full set is needed, and passing costs nothing.</p>':''}`);
    $('content').insertAdjacentHTML('beforeend',`<h3>Improve full districts</h3><p>This table uses ${({even:'even building: improve a lowest-level deed',free:'unrestricted building: choose any deed',district:'whole-district building: improve every deed together'})[rules.development.policy]}. There are ${rules.development.levels.length} levels. Construction raises rent, locks the district against trades and has no end-game resale value.</p><a href="./development.html" target="_blank" rel="noopener">See costs and break-even analysis</a>`);
  });
  const bytes=Uint8Array.from(atob($('binary').textContent),c=>c.charCodeAt(0));
  engine=(await WebAssembly.instantiate(bytes)).instance.exports;
  const requested=new URLSearchParams(location.search).get('board');
  if(requested!==null&&!boardFor(currentEdition,requested))throw Error('Unknown board. Open the game without the board parameter to choose a table.');
  const initialGame=play(['human','bot','bot'],requested??catalog.defaultBoard);promptSavedTable();await initialGame;
} catch(err){report(err)}
</script></body></html>
