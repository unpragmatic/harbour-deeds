/* The casting cup uses the confirmed face as its front; the other five turn out of sight. */
.die,.strip .die,.diceSet:has(.die:nth-child(3)) .die,.strip .diceSet:has(.die:nth-child(3)) .die{
  --half:23.5px;position:relative;display:block;padding:0;border:0;background:transparent;box-shadow:none;perspective:250px
}
.strip .die,.diceSet:has(.die:nth-child(3)) .die{--half:14.5px}
.strip .diceSet:has(.die:nth-child(3)) .die{--half:9px}
.dieCube,.pipFace{position:absolute;inset:0;border-radius:inherit}
.dieCube{transform-style:preserve-3d;transform:translateZ(calc(-1 * var(--half)))}
.pipFace{display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);place-items:center;padding:11%;border:1px solid #fff4d1;
  backface-visibility:hidden;background:linear-gradient(135deg,#fff8df,#efd5a2);box-shadow:inset -1px -2px 0 #af8d56;transform:translateZ(var(--half))}
.pipFace.face0{box-shadow:inset -1px -2px 0 #ae8b54,0 2px 0 #ab874c}
.pipFace.face1{transform:rotateY(180deg) translateZ(var(--half))}
.pipFace.face2{transform:rotateX(90deg) translateZ(var(--half))}
.pipFace.face3{transform:rotateY(90deg) translateZ(var(--half))}
.pipFace.face4{transform:rotateX(-90deg) translateZ(var(--half))}
.pipFace.face5{transform:rotateY(-90deg) translateZ(var(--half))}
.pipFace:not(.face0){background:#e8c998}

  let odds=[1];for(let j=0;j<count;j++){const next=Array(odds.length+sides).fill(0);odds.forEach((v,i)=>{for(let k=1;k<=sides;k++)next[i+k]+=v/sides});odds=next}
  oddsCache.set(key,odds);return odds;
}
function visits(n,turns,dice,once=false){
  const odds=diceOdds(dice);
  const key=`${n}:${dice?.count??2}:${dice?.sides??6}:${once}`;
  if(!visitCache.has(key))visitCache.set(key,[Array(n).fill(0)]);
  const byTurn=visitCache.get(key);
  while(byTurn.length<=turns){
    const later=byTurn.at(-1),result=Array(n).fill(0);
    for(let i=0;i<n;i++)odds.forEach((p,d)=>{
      const gap=(i+n-(d%n))%n,hit=Number(gap===0);
      result[i]+=p*(hit+(once && hit?0:later[gap]));
    });
    byTurn.push(result);
  }
  return byTurn[turns];
}
function traffic(k,s,rules,once=false){
  const n=rules.tiles.length;
  let total=0,miss=1;
  for(const [i,p] of s.players.entries()){
    if(i===s.turn||p.out)continue;
    const rolls=rules.rounds-s.round+Number(i>s.turn);
    const h=visits(n,rolls,rules.dice,once)[(k-p.pos+n)%n];
    total+=h;miss*=1-h;
  }
  return once?1-miss:total;
}
function projectedGain(q,s,rules){
  return q.tiles.reduce((sum,k)=>{
    const level=rules.development.levels[s.levels[k]];
    const gain=Math.round(rules.tiles[k].rent*level.rent_pct/100)-(s.rents[k]-(s.bonuses?.[k]??0));
    return sum+gain*traffic(k,s,rules);
  },0);
}
// Liquidate only to materially reduce a known next-roll default risk, not to
// turn cheap auction wins into cash at the expense of final list-value wealth.
function rescueSale(s,rules){
  if(!s.sells?.length)return;
  const actor=s.turn,p=s.players[actor],n=rules.tiles.length;
  const short=diceOdds(rules.dice).map((prob,d)=>{
    const path=p.pos+d,k=path%n,t=rules.tiles[k];
    const bill=t.kind==='fee'?t.price:s.owners[k]!=null && s.owners[k]!==actor?Math.max(0,s.rents[k]-p.cover):0;
    return {prob,need:bill-p.cash-Math.floor(path/n)*rules.salary};
  }).filter(x=>x.prob>0 && x.need>0);
  if(short.reduce((sum,x)=>sum+x.prob,0)<0.10)return;
  return s.sells.map(q=>{
    const saved=short.reduce((sum,x)=>sum+(q.price>=x.need?x.prob:0),0);
    return {tile:q.tile,saved,loss:value(s,rules,q.tile,actor)-q.price+(s.bonuses?.[q.tile]??0)};
  }).filter(x=>x.saved>0).sort((a,b)=>b.saved-a.saved||a.loss-b.loss)[0];
}

function value(s, rules, i, who) {
  const t = rules.tiles[i];
  const district = rules.tiles.flatMap((other, k) => other.group === t.group ? [k] : []);
  const others = district.filter(k => k !== i && s.owners[k] === who).length;
  const remaining = (rules.rounds - s.round + 1) / rules.rounds;
  return t.price + Math.round(t.rent * remaining * (others === district.length - 1 ? 4 : others + 0.4));
}

export function botMove(s, rules) {
  const actor = actingSeat(s), cash = s.players[actor].cash;
  const reserve = Math.min(rules.salary, cash / 3);
  const step = rules.auction_increment;
  // In a duel, a collected dollar can also cost the only rival a dollar.
  // Credit that second dollar only for rent not already covered by their guild.
  const duelRival=s.players.length===2?s.players[1-actor]:null;
  const rentWeight=duelRival&&!duelRival.cover?2:1;
  const send = (action, extra = {}) => ({action, actor, ...extra});
  if(s.phase==='works'){
    const best=s.commissions.filter(q=>q.cost<=cash-reserve)
      .map(q=>({q,net:rentWeight*traffic(q.tile,s,rules,true)*q.gain-q.cost})).sort((a,b)=>b.net-a.net)[0];
    return best?.net>0?send('commission',{tile:best.q.tile}):send('skip');
  }
  if(s.phase==='guild'){
    const p=s.players[actor],t=rules.tiles[p.pos],turns=rules.rounds-s.round;
    const exposed=s.rents.filter((_,k)=>s.owners[k]!==null&&s.owners[k]!==actor);
    const benefit=exposed.reduce((sum,r)=>sum+Math.max(0,Math.min(t.cover_offer,r)-Math.min(p.cover,r)),0);
    return send(exposed.length && (1-(1-exposed.length/rules.tiles.length)**turns)*benefit/exposed.length>t.cash_offer?'insure':'grant');
  }
  if (s.phase === 'offer') {
    const tile = rules.tiles[s.players[actor].pos];
    // If rivals cannot meet the list price, try buying it cheaper at auction.
    const rival = Math.max(...s.players.map((p,i) => i === actor || p.out ? 0 : p.cash));
    return send(tile.price <= cash - reserve && rival >= tile.price ? 'buy' : 'pass');
  }
  if (s.phase === 'auction') {
    const {tile, high_bid} = s.auction;
    const ceiling = Math.min(value(s,rules,tile,actor), cash - reserve);
    const next = Math.max(high_bid + step, Math.floor((high_bid + (ceiling - high_bid) * 0.55) / step) * step);
    return ceiling < high_bid + step ? send('withdraw') : send('bid', {amount:Math.min(next,Math.floor(ceiling / step) * step)});
  }
  if (s.phase === 'trade') {
    const t = s.trade;
    const benefit = t.give_cash + (t.give_deed === null ? 0 : value(s,rules,t.give_deed,actor));
    const cost = t.take_cash + (t.take_deed === null ? 0 : value(s,rules,t.take_deed,actor));
    return send(benefit >= cost && cash - t.take_cash >= reserve ? 'accept' : 'reject');
  }
  if(s.phase==='roll'){
    const q=rescueSale(s,rules);
    if(q)return send('sell',{tile:q.tile});
  }
  if (s.phase === 'roll' && !s.traded) {
    // Seek mutually valuable acquisitions rather than sending speculative offers every turn.
    const deals = s.owners.flatMap((to, i) => {
      if (to === null || to === actor || locked(s,rules,i)) return [];
      const max = value(s,rules,i,actor), min = value(s,rules,i,to);
      const give_cash = Math.ceil((max+min)/2);
      return max-min >= step && give_cash <= cash-reserve ? [{to,i,give_cash,margin:max-min}] : [];
    }).sort((a,b) => b.margin-a.margin);
    if(deals.length) {
      const {to,i,give_cash}=deals[0];
      return send('propose',{to,take_deed:i,give_deed:null,take_cash:0,give_cash});
    }
    if(s.phase==='roll'){
      const options=(s.builds||[]).filter(q=>q.cost<=cash-reserve).map(q=>({q,net:rentWeight*projectedGain(q,s,rules)-q.cost})).sort((a,b)=>b.net-a.net);
      if(options[0]?.net>0)return send('build',{tile:options[0].q.tile});
    }
  }
  return send(s.phase);
}

// All sound is synthesized on this device. No samples, timers or RNG in the engine.
let audio, bus, felt, sound=true;
const voices=new Set();
function stopFoley(){
  // Cancel the scheduled dock as well as sounds that are already playing.
  for(const source of voices)source.stop();voices.clear();
}
function soundButton(){
  const b=$('soundBtn');b.textContent=sound?'♪ On':'♪ Off';b.setAttribute('aria-pressed',String(sound));
}
function unlockSound(){
  if(!sound)return;
  if(!audio){
    const Context=window.AudioContext||window.webkitAudioContext;
    if(!Context){sound=false;soundButton();$('soundBtn').disabled=true;$('soundBtn').title='Audio unavailable';return}
    try{audio=new Context()}catch{sound=false;soundButton();$('soundBtn').disabled=true;return}
    bus=audio.createGain();bus.gain.value=.45;bus.connect(audio.destination);
    felt=audio.createBuffer(1,Math.ceil(audio.sampleRate*.2),audio.sampleRate);
    let seed=97;
    const data=felt.getChannelData(0);
    for(let i=0;i<data.length;i++){seed=(Math.imul(seed,1664525)+1013904223)>>>0;data[i]=seed/2147483648-1}
  }
  bus.gain.value=.45;
  if(audio.state==='suspended')audio.resume().catch(e=>console.warn('Could not unlock table sound:',e));
}
function initSound(){
  try{sound=localStorage.getItem('harbor-sound')!=='off'}catch(e){console.warn('Sound preference unavailable:',e)}
  soundButton();
  for(const event of ['pointerdown','keydown'])document.addEventListener(event,unlockSound);
  $('soundBtn').onclick=()=>{
    sound=!sound;
    if(sound){unlockSound();if(audio)audio.resume().then(()=>foley('bell')).catch(e=>console.warn('Audio unavailable:',e))}
    else if(bus){stopFoley();bus.gain.value=0}
    soundButton();
    try{localStorage.setItem('harbor-sound',sound?'on':'off')}catch(e){console.warn('Could not save sound preference:',e)}
  };
}
function foley(kind,delayMs=0){
  if(!sound||audio?.state!=='running'||document.hidden)return;
  const t=audio.currentTime+delayMs/1000;
  function strike(type,from,to,delay,length,gain){
    const at=t+delay,v=audio.createGain(),noise=type==='noise';
    const source=noise?audio.createBufferSource():audio.createOscillator();
    const filter=noise?audio.createBiquadFilter():null;
    if(noise){
      source.buffer=felt;filter.type='bandpass';filter.Q.value=.75;
      filter.frequency.value=from;source.connect(filter);filter.connect(v);
    }else{
      source.type=type;source.frequency.setValueAtTime(from,at);
      source.frequency.exponentialRampToValueAtTime(to,at+length);source.connect(v);
    }
    v.gain.setValueAtTime(.0001,at);v.gain.exponentialRampToValueAtTime(gain,at+.004);
    v.gain.exponentialRampToValueAtTime(.0001,at+length);
    v.connect(bus);voices.add(source);source.start(at);source.stop(at+length+.002);
    source.onended=()=>{voices.delete(source);source.disconnect();filter?.disconnect();v.disconnect()};
  }
  const knock=(at,power,pitch)=>{strike('triangle',pitch,pitch*.45,at,.09,power);strike('noise',1400,0,at,.055,power*.9)};
  const chime=(at,pitch)=>{strike('sine',pitch,pitch*.992,at,.22,.14);strike('sine',pitch*2.7,pitch*2.69,at,.09,.045)};
  switch(kind){
    case 'dice': [0,.048,.12,.235,.355].forEach((at,i)=>knock(at,.23-i*.023,460-i*44));break;
    case 'cast': [0,.1,.24,.42,.56,.67,.75].forEach((at,i)=>knock(at,.21-i*.016,510-i*38));break;
    case 'depart': strike('noise',780,0,0,.19,.12);break;
    case 'dock': strike('noise',820,0,0,.17,.19);knock(.035,.21,186);chime(.12,587);break;
    case 'file': strike('noise',2100,0,0,.16,.22);knock(.14,.28,290);chime(.21,988);break;
    case 'sale': strike('noise',1650,0,0,.12,.22);knock(.08,.2,330);chime(.15,1175);chime(.24,880);break;
    case 'sold': knock(0,.35,210);strike('sine',119,78,.015,.19,.19);chime(.16,740);break;
    case 'noSale': knock(0,.22,275);knock(.19,.13,185);break;
    case 'district': [523,659,784].forEach((p,i)=>chime(i*.075,p));break;
    case 'gavel': knock(0,.35,240);knock(.125,.14,170);break;
    case 'build': knock(0,.25,290);knock(.11,.29,230);chime(.24,660);break;
    case 'paper': strike('noise',2500,0,0,.14,.27);knock(.12,.16,280);break;
    case 'coin': chime(0,1046);chime(.095,1396);break;
    case 'bid': knock(0,.16,520);chime(.038,740);break;
    case 'down': strike('triangle',350,145,0,.17,.22);break;
    case 'final': [392,494,587,784].forEach((n,i)=>chime(i*.09,n));break;
    case 'bell': chime(0,784);break;
  }
}

function diceProp(values){
  const face=v=>pips[v]?pips[v].map(i=>`<i style="grid-area:${1+Math.floor(i/3)} / ${1+i%3}"></i>`).join(''):v;
  return `<span class="diceSet">${values.map(v=>{
    const side=({1:[2,3],2:[6,3],3:[2,6],4:[2,1],5:[1,3],6:[5,3]})[v];
    const faces=side&&(rules.dice?.sides??6)===6&&effectivePace()!=='reduced'?[v,7-v,...side,7-side[0],7-side[1]]:[v];
    return `<span class="die" data-value="${v}"><span class="dieCube">${faces.map((n,i)=>`<span class="pipFace face${i}">${face(n)}</span>`).join('')}</span></span>`;
  }).join('')}</span>`;
}

const animations=new Set(), effectTimers=new Set();
let lastDeltas=[], readThrough=0,voyager=null;
function maskVoyager(){
  if(!voyager)return;
  const berth=$(`tile-${voyager.tile}`);
  voyager.token=Array.from(berth.querySelectorAll('.token')).find(el=>+el.textContent===voyager.actor+1);
  voyager.token?.classList.add('atSea');
}
function releaseBerth(){voyager?.token?.classList.remove('atSea');voyager=null}
// This is an optional presentation budget for local automated turns, never an input or clock gate.
function presentationWait(ms){return Math.max(ms,Math.ceil(readThrough-performance.now()))}
function later(ms,fn){
  const id=setTimeout(()=>{effectTimers.delete(id);fn()},ms);effectTimers.add(id);
}
function clearMotion(){
  readThrough=0;
  effectTimers.forEach(clearTimeout);effectTimers.clear();
  animations.forEach(a=>a.cancel());animations.clear();
  $('wake').replaceChildren();releaseBerth();stopFoley();
}
function resetStage(){

}
function syncPrefs(){
  const effective=effectivePace();
  document.documentElement.dataset.motion=effective;
  const note=$('motionStatus'),accent=$('showAccents');
  if(note)note.textContent=(still.matches?'Your system requests reduced motion. Animations are off regardless of your selection.':
    `${paceChoices.find(row=>row[0]===effective)[1]} is active.`)+(storageAvailable?'':' Storage is unavailable; this choice lasts for this visit.');
  if(accent)accent.disabled=effective==='reduced';
}
function openPrefs(){
  openDialog(`<h2>Table presentation</h2><p>These preferences stay in this browser. They do not change another player’s view or the bidding clock.</p>
    <fieldset id="motionChoices"><legend>Animation pace</legend>${paceChoices.map(([v,name,help])=>
    `<label><input type="radio" name="motionPace" value="${v}" ${pace===v?'checked':''}><span><b>${name}</b><small>${help}</small></span></label>`).join('')}</fieldset>
    <label class="fxOption"><input type="checkbox" id="showAccents" ${accents?'checked':''}> Show wakes, stamps and district seals</label>
    <p id="motionStatus" role="status"></p>`);
  const change=()=>{
    pace=$('motionChoices').querySelector(':checked').value;accents=$('showAccents').checked;
    try{localStorage.setItem(prefsKey,JSON.stringify({pace,accents}));storageAvailable=true}catch{storageAvailable=false}
    clearMotion();syncPrefs();
  };
  $('motionChoices').onchange=change;$('showAccents').onchange=change;syncPrefs();
}
function initFeedback(){
  let saved;
  try{saved=JSON.parse(localStorage.getItem(prefsKey))}catch(e){if(e.name!=='SyntaxError')storageAvailable=false}
  if(paceChoices.some(([v])=>v===saved?.pace))pace=saved.pace;
  accents=saved?.accents!==false;syncPrefs();
  if($('prefsBtn'))$('prefsBtn').onclick=openPrefs;
  initSound();routeScreen.addEventListener('change',()=>{clearMotion();placeStage()});
  still.addEventListener('change',()=>{clearMotion();syncPrefs()});

function ledger(s){

    return `<div class="account ${actor===i&&s.phase!=='over'?'acting':''}" style="--seat:${colors[i]}" aria-label="${seat(i)}: ${p.out?'bankrupt':money(p.cash)}${diff?', change '+signed(diff):''}"><span class="seatDisc">${i+1}</span><span class="seatName">${seat(i)}</span><b>${p.out?'Out':money(p.cash)}</b>${diff?`<em class="${diff>0?'credit':'debit'}">${signed(diff)}</em>`:''}</div>`;
  }).join('');
  $('stageLedger').innerHTML=rows;$('sheetLedger').innerHTML=rows;
}

  ledger(s);maskVoyager();
  if($('stage').dataset.live)return;
  const tile=s.auction?.tile??s.players[s.turn].pos;
  const context={roll:'Ready to sail',offer:'Deed for sale',guild:'Guild charter',works:'Harbor works',auction:'At auction',trade:'Contract offered',end:'Settlement',over:'Final accounts'};
  plate(context[s.phase],s.phase==='over'?s.winners.map(seat).join(' & '):rules.tiles[tile].name,
    s.phase==='roll'?`${seat(s.turn)} to roll · ${rules.dice?.count??2} dice`:s.events.at(-1)||context[s.phase],
    icon(s.phase==='auction'?'gavel':s.phase==='over'?'final':'ship'),'ready');
}
function outcome(m,b,s){
  const a=m.actor,dieTotal=s.dice.reduce((x,y)=>x+y,0),pos=s.players[a].pos;
  const delta=s.players[a].cash-b.players[a].cash, lot=b.auction?.tile??m.tile??pos;
  const tile=rules.tiles[lot],who=seat(a),action=m.action;
  let tag=who,title='',detail='',prop='ship',cue=uxInventory.commands[action][2],kind=action,targets=[lot];
  let sets=[];
  if(s.phase==='over'){
    tag='Final accounts';title=`${s.winners.map(seat).join(' & ')} ${s.winners.length>1?'tie':'wins'}`;
    detail='Cash and deed values settled';prop='final';cue='final';kind='final';targets=[];
  }else if(action==='roll'){
    tag=`${who} rolled ${dieTotal}`;title=tile.name;prop='dice';
    if(tile.kind==='deed')detail=s.owners[pos]===null?`For sale · ${money(tile.price)}`:s.owners[pos]===a?'Your own deed':`Rent to ${seat(s.owners[pos])} · ${money(b.rents[pos])}`;
    else detail=({guild:'Guild charter · cash or cover',works:s.commissions?.length?'Public works · commission a deed or skip':'Public works · no eligible project',fee:`Harbor dues · ${money(tile.price??0)}`,start:'Port salary',rest:'Safe harbor',notice:'Port notice',
      exchange:s.auction?`Auction: ${rules.tiles[s.auction.tile].name}`:'All deeds owned'})[tile.kind];
    if(s.last_card!=null){title=rules.cards[s.last_card].title;detail=`Dispatch at ${tile.name}`;kind='dispatch'}
    if(delta)detail+=` · Net ${signed(delta)}`;
    if(s.players[a].cover!==b.players[a].cover&&!s.players[a].out)detail+=` · Cover ${money(s.players[a].cover)}`;
    if(s.players[a].out)detail+=' · Bankrupt';
  }else if(b.auction&&!s.auction){
    const winner=s.owners[lot];tag='Auction closed';title=winner==null?'No sale':`Sold · ${money(action==='bid'?m.amount:b.auction.high_bid)}`;
    detail=`${tile.name} · ${winner==null?'Still on the market':seat(winner)+' takes the deed'}`;kind='sold';prop='gavel';cue=winner==null?'noSale':'sold';
  }else if(action==='pass'||action==='bid'||action==='withdraw'){
    tag=action==='pass'?'Auction opened':action==='bid'?'High bid':'Bidder out';
    title=action==='pass'?tile.name:action==='bid'?money(m.amount):`${who} withdrew`;
    detail=action==='pass'?`Bidding starts at ${money(rules.auction_increment)}`:`${tile.name} · ${action==='bid'?who+' leads':seat(s.auction.actor)+' to bid'}`;prop='gavel';
  }else if(action==='buy'){
    tag='Deed recorded';title=tile.name;detail=`${who} paid ${money(-delta)} · Rent ${money(s.rents[lot])}`;prop='deed';cue='file';
  }else if(action==='sell'){
    const quote=b.sells.find(q=>q.tile===lot);
    tag='Sold to the bank';title=tile.name;
    detail=`Bank paid ${money(quote.price)} · ${who}: ${money(b.players[a].cash)} → ${money(s.players[a].cash)} · Back on the market`;prop='deed';cue='sale';
  }else if(action==='commission'){
    const quote=b.commissions.find(q=>q.tile===lot);
    tag='Works commissioned';title=tile.name;

          if(resume&&!authenticated&&msg.kind==='challenge'&&validKey(msg.nonce)){
            const args=[code,r.device,nonce,msg.nonce];
            if(msg.mac!==await proof(r.save.key,'host',...args))throw Error('Host identity did not match');
            authenticated=true;link.send({kind:'proof',mac:await proof(r.save.key,'guest',...args)});return;
          }
          if(!resume&&!authenticated&&msg.kind==='welcome'&&[1,2,3].includes(msg.device)&&validKey(msg.key)){
            r.device=msg.device;r.save={role:'guest',code,device:r.device,key:msg.key};persist(r);
            authenticated=true;clearTimeout(r.timeout);link.send({kind:'enrolled'});roomMenu();return;
          }
          if(!authenticated)throw Error('Unverified host');
          if(msg.kind==='ended'){finishRoom(r,'The host or a device deliberately ended the table.',{forget:true});return}
          if(msg.kind==='start'&&!r.started&&Number.isSafeInteger(msg.count)&&msg.count>=0){
            r.count=msg.count;startNetwork(r,msg.config);
          }else if(msg.kind==='replay'&&r.count!==undefined&&Array.isArray(msg.moves)&&msg.moves.length<=40){
            for(const move of msg.moves)replay(r,move);
          }else if(msg.kind==='caughtUp'&&msg.seq===r.seq&&r.count===r.seq){
            delete r.count;clearTimeout(r.timeout);link.send({kind:'ready',seq:r.seq});
          }else if(msg.kind==='status'&&r.started&&msg.seq===r.seq&&Array.isArray(msg.missing)&&Number.isFinite(msg.remaining)){
            r.missing=msg.missing;r.remaining=msg.remaining;r.deadline=0;networkStep(r);
          }else if(msg.kind==='commit'&&r.started&&msg.seq===r.seq+1){
            const before=state;replay(r,msg.move);r.remaining=r.seconds*1000;r.deadline=0;networkStep(r);liveFeedback(msg.move,before,state);
          }else if(msg.kind==='reject'&&msg.seq===r.seq){r.remaining=remaining(r);networkStep(r)}
          else throw Error('Out-of-order or incompatible host message');
        }catch(e){fail(`Could not synchronize: ${e.message}`)}
      });
    });
    r.peer.on('connection',link=>{
      if(!host){link.close();return}
      let id,challenge;
      const deny=()=>{link.send({kind:'closed'});setTimeout(()=>link.close(),150)};
      const handshake=setTimeout(()=>{if(!id)link.close()},15000);
      link.on('data',async msg=>{
        if(room!==r)return;
        if(!id){
          if(msg?.kind==='join'&&!r.started&&r.links.size<3){
            id=[1,2,3].find(i=>!r.links.has(i));r.links.set(id,link);r.keys[id]=randomHex();
            const available=r.slots.findIndex(v=>v===-1||v===-2);if(available!==-1)r.slots[available]=id;
            link.send({kind:'welcome',device:id,key:r.keys[id]});clearTimeout(handshake);hostLobby(r);return;
          }
          if(msg?.kind==='hello'&&!challenge&&r.started&&[1,2,3].includes(msg.id)&&validKey(msg.nonce)&&r.owners.includes(msg.id)&&!r.links.has(msg.id)){
            const n=randomHex(),args=[code,msg.id,msg.nonce,n];
            challenge={id:msg.id};
            challenge.expected=await proof(r.keys[msg.id],'guest',...args);
            link.send({kind:'challenge',nonce:n,mac:await proof(r.keys[msg.id],'host',...args)});return;
          }
          if(msg?.kind==='proof'&&validKey(msg.mac)&&msg.mac===challenge?.expected&&!r.links.has(challenge.id)){
            id=challenge.id;r.links.set(id,link);clearTimeout(handshake);sendReplay(r,link);return;
          }
          deny();return;
        }
        if(r.links.get(id)!==link)return;
        if(!r.started){if(msg?.kind==='enrolled'&&!r.enrolled.has(id)){r.enrolled.add(id);hostLobby(r)}return}
        if(msg?.kind==='leave'){finishRoom(r,`Device ${id} deliberately left the table.`,{forget:true,notify:true});return}
        if(msg?.kind==='ready'&&msg.seq===r.seq&&!r.synced.has(id)){r.synced.add(id);hostStatus(r);return}
        if(msg?.kind==='intent'&&msg.seq===r.seq&&!r.missing.length)acceptMove(r,id,msg.move);
      });
      const lost=()=>{
        clearTimeout(handshake);if(room!==r||r.links.get(id)!==link)return;
        r.links.delete(id);
        if(r.started){r.synced.delete(id);hostStatus(r);return}
        delete r.keys[id];r.enrolled.delete(id);
        r.slots=r.slots.map((v,i)=>v===id?(i<2?-1:-2):v);hostLobby(r);
      };
      link.on('close',lost);link.on('error',lost);
    });
  }catch(e){fail(e.message)}
}
function broadcast(r,msg){for(const link of r.links.values())link.send(msg)}
function startNetwork(r,c){
  if(!c||!(c.edition===undefined||c.edition===currentEdition)||!Object.hasOwn(maps,c.map)||!(c.policy===undefined||['even','district','free'].includes(c.policy))||![0,5,15,30].includes(c.seconds)||
     !Number.isInteger(c.seed)||c.seed<0||c.seed>0xffffffff||!Array.isArray(c.owners)||
     c.owners.length<2||c.owners.length>4||!c.owners.every(n=>[-1,0,1,2,3].includes(n))||
     (!r.host&&!c.owners.includes(r.device)))throw Error('Invalid host settings');
  r.started=true;r.owners=c.owners;r.seconds=c.seconds;r.remaining=c.seconds*1000;
  initialize(c.owners.map(n=>n<0?'bot':'human'),c.map,c.seconds,c.seed,c.policy,c.edition??'launch');
  $('modal').close();
}
function replay(r,move){
  if(!(playable.has(move?.action)||move?.action==='end'))throw Error('Invalid journal command');
  state=command(move);r.seq++;
}
function commit(r,move){
  const before=state;state=command(move);
  r.save.journal.push(move);r.save.remaining=r.remaining=r.seconds*1000;r.deadline=0;
  // A move becomes visible to players only after the atomic storage write succeeds.
  try{persist(r)}catch{finishRoom(r,'Move not recorded. Free browser storage and rehost the last saved turn.');return}
  r.seq++;
  broadcast(r,{kind:'commit',seq:r.seq,move});
  networkStep(r);
  liveFeedback(move,before,state);
}
function acceptMove(r,device,move){
  const actor=actingSeat(state);
  if(r.missing.length||!playable.has(move?.action)||move.actor!==actor||r.owners[actor]!==device||state.phase==='over'||state.phase==='end')return;
  const fields=move.action==='propose'?['to','give_deed','take_deed','give_cash','take_cash']:move.action==='bid'?['amount']:['build','sell','commission'].includes(move.action)?['tile']:[];
  if(fields.some(k=>!Number.isSafeInteger(move[k])&&!(k.endsWith('_deed')&&move[k]===null))){
    r.links.get(device)?.send({kind:'reject',seq:r.seq});return;
  }
  move=Object.fromEntries(['action','actor',...fields].map(k=>[k,move[k]]));
  if(r.deadline&&performance.now()>=r.deadline){commit(r,{action:'withdraw',actor});return}
  try{commit(r,move)}catch(e){
    if(device>0)r.links.get(device)?.send({kind:'reject',seq:r.seq});
    else {r.remaining=remaining(r);networkStep(r)}
  }
}
function networkStep(r){
  r.step?.abort();r.step=new AbortController();
  const {signal}=r.step,seq=r.seq,actor=actingSeat(state),owner=r.owners[actor];
  if($('contract')&&$('modal').open)$('modal').close();
  render();r.deadline=0;
  if(state.phase==='over')return;
  const deviceName=n=>n<0?'Bot':n===r.device?'This device':n===0?'Host':`Device ${n}`;
  $('controlType').textContent=`${seat(actor)} · ${deviceName(owner)}`;
  const timed=state.phase==='auction'&&clockSeconds&&owner>=0;
  if(r.missing.length){
    $('actions').textContent=`Table paused · Waiting for ${r.missing.map(n=>'Device '+n).join(', ')} to rejoin from the original browser.`;
    if(timed){
      const meter=makeBidMeter('Host bid clock',clockSeconds*1000);
      $('actions').prepend(meter.element);meter.update(r.remaining,true);
    }
    return;
  }
  if(r.leaving){$('actions').textContent='Waiting for leave confirmation…';return}
  if(state.phase==='end'||owner===-1){
    if(r.host)wait(state.phase==='end'?950:850,signal).then(()=>{
      if(!signal.aborted)commit(r,state.phase==='end'?{action:'end',actor:state.turn}:botMove(state,rules));
    });
    return;
  }
  if(owner===r.device){
    controllers.human(state,signal).then(move=>{
      if(!move||signal.aborted)return;
      if(r.host)acceptMove(r,0,move);
      else {r.link.send({kind:'intent',seq,move});$('actions').textContent='Waiting for host…'}
    });
  }else $('actions').textContent=`Waiting for ${deviceName(owner)}…`;
  if(timed){
    r.deadline=performance.now()+r.remaining;
    const meter=makeBidMeter('Host bid clock',clockSeconds*1000);$('actions').prepend(meter.element);
    const tick=()=>{
      const ms=r.deadline-performance.now();
      meter.update(ms);
      if(r.host&&ms<=0)commit(r,{action:'withdraw',actor});
    };
    const timer=setInterval(tick,100);signal.addEventListener('abort',()=>clearInterval(timer),{once:true});tick();
  }
  window.addEventListener('pagehide',()=>{
    const r=room;if(!r)return;
    if(r.host&&r.started&&r.hasSave&&r.deadline){
      r.save.remaining=remaining(r);try{persist(r)}catch{/* previous journal remains intact */}
    }
    room=null;r.step?.abort();clearTimeout(r.timeout);r.peer?.destroy();r.unlock?.();
  });
  window.addEventListener('pageshow',e=>{if(e.persisted&&!room&&$('setupBtn').textContent==='Network table')location.reload()});
}

  const cells=rules.tiles.map((_,i)=>{
    const b=$(`tile-${i}`),label=b.getAttribute('aria-label'),value=b.querySelector('.tileValue').textContent;

function releasePlots(){

function closePlots(focus=false){

function pickPlot(i){

}
function openPlots(mode,i){
  if(!plotAccess)return;
  const {s}=plotAccess;

  mode??=s.phase==='works'?'commission':s.builds.some(q=>q.cost<=cash)||!s.sells?.length?'build':'sell';
  const preferred=i??plotDesk?.i??inspected;

function stepPlot(dir,focus=false){

function plotImpact(s,mode,i,q){
  const t=rules.tiles[i],cash=s.players[s.turn].cash;
  const group=rules.tiles.flatMap((x,k)=>x.kind==='deed'&&x.group===t.group?[k]:[]);
  if(mode==='sell'){
    const complete=group.every(k=>s.owners[k]===s.turn);
    return {metrics:[['Bank pays','+'+money(q.price)],['Cash after',money(cash+q.price)],['Rent forfeited',money(s.rents[i])]],
      note:`Returns to market.${complete?' Breaks the set: remaining deeds lose their set rent.':''}${s.bonuses?.[i]?' The unused refit is lost.':''}`,
      detail:bankTerms(),scope:complete?group:[i],button:`Sell for ${money(q.price)}`};
  }
  const short=q.cost>cash,after=short?`${money(q.cost-cash)} short`:money(cash-q.cost);
  if(mode==='commission')return {metrics:[['Fee now',money(q.cost)],['Cash after',after],['Next rent',`${money(s.rents[i])} → ${money(s.rents[i]+q.gain)}`]],
    note:`+${money(q.gain)} once: gain ${money(q.gain-q.cost)} net if collected in full; lose ${money(q.cost)} if unused.`,
    detail:'No full set required. This is not a permanent level.',scope:[i],button:`Refit for ${money(q.cost)}`};
  const d=rules.development,affected=plotMembers(q);

  const current=k=>s.rents[k]-(s.bonuses?.[k]??0);
  const gains=affected.map(k=>next(k)-current(k));
  const range=(nums,format)=>{const lo=Math.min(...nums),hi=Math.max(...nums);return lo===hi?format(lo):`${format(lo)}–${format(hi)}`};
  const rolls=(rules.rounds-s.round)*(s.players.filter(p=>!p.out).length-1)+s.players.filter((p,k)=>!p.out&&k>s.turn).length;
  const visits=range(gains.map(g=>g>0?Math.ceil(q.cost/g):Infinity),v=>Number.isFinite(v)?String(v):'∞');
  return {metrics:[['Build cost',money(q.cost)],['Cash after',after],['Rent / visit',`${money(current(i))} → ${money(next(i))}`]],
    note:`${affected.length>1?`All ${affected.length} deeds improve. `:''}+${range(gains,money)} per paying visit · ${visits} to recover cost. ${t.group} ${s.locked[i]?'stays locked':'locks'} against sale and trade.`,
    detail:`Level ${s.levels[i]} → ${s.levels[i]+1}. Up to ${rolls} rival rolls left. No resale value.${s.bonuses?.[i]?' Permanent rents shown; the one-use refit remains.':''}`,scope:s.locked[i]?affected:group,button:`Build for ${money(q.cost)}`};
}

const $ = id => document.getElementById(id);
const maps = {compact:JSON.parse($('config').textContent),outer:JSON.parse($('outer').textContent),grand:JSON.parse($('grand').textContent)};
const currentEdition='dockworks-1',legacyMaps=JSON.parse($('legacyMaps').textContent);
const DEFAULT_CLOCK=5;
let rules=maps.compact, clockSeconds=DEFAULT_CLOCK;
const colors = ['#9a321f','#006458','#76500b','#53468d'];
const bands = {'Old Town':'#b76952', Foundry:'#d39e47', Market:'#7989a9', Marina:'#589587', Shipyards:'#ac84a2', Exchange:'#7195aa',Tidelands:'#80a357',Headlands:'#94724e'};

const seat = n => `Seat ${n + 1}`;
let engine, state, seats, session;

function command(input) {
  const bytes = new TextEncoder().encode(JSON.stringify(input));
  const ptr = engine.reserve(bytes.length);
  new Uint8Array(engine.memory.buffer, ptr, bytes.length).set(bytes);
  const out = engine.dispatch();
  const result = JSON.parse(new TextDecoder().decode(new Uint8Array(engine.memory.buffer, out, engine.length())));
  if (result.error) throw new Error(result.error);
  return result;
}

const deeds = (s, who) => s.owners.flatMap((owner,i)=>owner===who?[i]:[]);
function bankTerms(){
  const sale=rules.bank_sale??{rate_pct:50,basis:'list'};
  return `The bank pays ${sale.rate_pct}% of ${sale.basis==='list'?'the printed list price':'the price last paid to the bank'}.`;
}
function compose(s, send) {

  const a=s.turn;
  const peers=s.players.flatMap((p,i)=>!p.out && i!==a && (deeds(s,i).length||deeds(s,a).length)?[i]:[]);

function wait(ms,signal) {

function bidClock(seconds,signal,onExpiry) {

  let left=seconds*1000, since=null, expired=false;
  const remaining=()=>left-(since===null?0:performance.now()-since);

    if(expired||signal.aborted)return;
    if(document.hidden||$('modal').open){
      left=remaining();since=null;
    }else if(since===null){since=performance.now()}
    const ms=remaining();
    if(ms<=0){expired=true;onExpiry();return}
    meter.update(ms,since===null);

  $('modal').addEventListener('clockchange',update,{signal});
  $('modal').addEventListener('close',update,{signal});
  signal.addEventListener('abort',()=>clearInterval(timer),{once:true});
  update();

}

function boardSize(){

function boardPosition(i) {

async function play(types,map='grand',seconds=DEFAULT_CLOCK,policy=rules.development.policy) {

  initialize(types,map,seconds,crypto.getRandomValues(new Uint32Array(1))[0],policy);
  render();
  while(!signal.aborted) {
    if(state.phase==='over') return;
    const step=new AbortController();
    const cancel=()=>step.abort();
    signal.addEventListener('abort',cancel,{once:true});
    const action=state.phase==='end'
      ? (await wait(presentationWait(950),step.signal),{action:'end',actor:state.turn})
      : await controllers[seats[actingSeat(state)]](state,step.signal);
    signal.removeEventListener('abort',cancel); step.abort();

  }

  for(const tab of document.querySelectorAll('[data-view]')){
    const active=tab.dataset.view===name;tab.setAttribute('aria-pressed',String(active));
    $(tab.dataset.view+'View').hidden=!active&&!(desktop.matches&&tab.dataset.view==='board');
  }
  $('inspector').hidden=!desktop.matches||name!=='board';
  document.querySelector('[data-view=board]').textContent=desktop.matches?'Space':'Board';
}
desktop.addEventListener('change',()=>showView(document.querySelector('[data-view][aria-pressed=true]').dataset.view));
$('register').onclick=e=>{const b=e.target.closest('[data-deed]');if(b)detail(+b.dataset.deed)};
document.querySelector('.switcher').onclick=e=>{if(e.target.dataset.view)showView(e.target.dataset.view)};
document.addEventListener('keydown',e=>{
  if($('modal').open||e.repeat||e.isComposing||e.altKey||e.ctrlKey||e.metaKey||e.target.matches('input,textarea,select,[contenteditable=true]'))return;
  if(plotDesk&&e.key==='Escape'){e.preventDefault();closePlots(true);return}
  if(!desktop.matches)return;
  const key=e.key.toUpperCase(),view={B:'board',F:'players',L:'activity'}[key];
  if(plotAccess?.s.phase==='roll'&&['I','S'].includes(key)){
    e.preventDefault();openPlots(key==='I'?'build':'sell');return;
  }
  const control=view?document.querySelector(`[data-view="${view}"]`):key==='?'?$('rulesBtn'):!plotDesk&&/^[RT]$/.test(key)?document.querySelector(`#actions [data-key="${key}"]:enabled`):null;
  if(control){e.preventDefault();control.click()}
});
function setup(){
  if(room){roomMenu();return}
  const fields=Array.from({length:4},(_,i)=>`<label class="field">${seat(i)}<select id="seat-${i}">${(i<2?['human','bot']:['off','human','bot']).map(v=>`<option value="${v}" ${v===(seats[i]??'off')?'selected':''}>${{human:'Local player',bot:'Bot',off:'Empty'}[v]}</option>`).join('')}</select></label>`).join('');
  openDialog(`<h2>New table</h2><p>Choose how to play. Starting replaces this match.</p>
    <div class="modeChoices"><button id="solo"><b>Solo</b><span>You + two bots</span></button><button id="passPlay"><b>Pass &amp; play</b><span>Two on this device</span></button><button id="host"><b>Host online</b><span>Invite devices</span></button><button id="join"><b>Join online</b><span>Enter table code</span></button></div>
    ${savedTableButton()}<details id="advanced"><summary>Custom local table</summary>${settings()}${fields}<button id="start" class="primary">Start game</button></details>`);
  bindSavedTableButton();
  const quick=types=>{$('modal').close();play(types,$('board').dataset.map,clockSeconds).catch(report)};
  $('solo').onclick=()=>quick(['human','bot','bot']);$('passPlay').onclick=()=>quick(['human','human']);
  $('host').onclick=hostRoom;$('join').onclick=()=>roomMenu(true);
  $('map').value=$('board').dataset.map;$('clock').value=String(clockSeconds);
  $('start').onclick=()=>{
    const types=[0,1,2,3].map(i=>$(`seat-${i}`).value).filter(v=>v!=='off');
    const map=$('map').value,seconds=Number($('clock').value);
    const policy=$('policy').value;$('modal').close();play(types,map,seconds,policy).catch(report);
  };
}
$('setupBtn').onclick=setup;
$('close').onclick=()=>$('modal').close();
$('modal').setAttribute('aria-label','Table information');
$('rulesBtn').onclick=()=>openDialog(`<h2>The rulebook</h2><p>Start with ${money(rules.cash)}. Roll two dice to move clockwise. Passing Port Office pays ${money(rules.salary)}.</p><h3>Buy or auction</h3><p>Buy a vacant deed at list price or send it to auction. Everyone, including the landing player, may bid. Raise by at least ${money(rules.auction_increment)} or withdraw. The last bidder pays their bid. Without a bid, the deed stays vacant.</p><h3>Negotiate before rolling</h3><p>Once per turn, propose a deed sale or swap. Either side may add cash; the other merchant can accept or decline. Owning a full district doubles its rent.</p><h3>Settle accounts</h3><p>If you cannot pay rent or a bill, your remaining cash is paid and your deeds return to market. Be the last solvent merchant, or finish round ${rules.rounds} with the greatest cash plus deed value. Ties share the win.</p>`);
try {
  initFeedback();
  $('rulesBtn').addEventListener('click',()=>{
    $('content').insertAdjacentHTML('afterbegin','<p class="keyGuide"><b>Desktop keys</b> &nbsp; R Roll · T Draft trade · I Improve · S Sell quote · B Space · F Players · L Activity · ← → browse focused spaces · Esc close sheet</p>');
    $('content').insertAdjacentHTML('beforeend',`<h3>Manage deeds on the board</h3><p>Before rolling, select a marked deed or choose Manage deeds. Switch between Improve and Sell to compare your options. Selecting a space only previews it; Confirm is a separate action. ${bankTerms()} Player trades leave the original bank acquisition price unchanged. Permanently developed districts cannot be sold.</p>${rules.tiles.some(t=>t.kind==='works')?'<h3>Public works</h3><p>Land at a works with an eligible deed to commission a one-use rent bonus. It pays only on the next rival rent. No full set is needed, and passing costs nothing.</p>':''}`);
    $('content').insertAdjacentHTML('beforeend',`<h3>Improve full districts</h3><p>This table uses ${({even:'even building: improve a lowest-level deed',free:'unrestricted building: choose any deed',district:'whole-district building: improve every deed together'})[rules.development.policy]}. There are ${rules.development.levels.length} levels. Construction raises rent, locks the district against trades and has no end-game resale value.</p><a href="./development.html" target="_blank" rel="noopener">See costs and break-even analysis</a>`);
  });
  const bytes=Uint8Array.from(atob($('binary').textContent),c=>c.charCodeAt(0));
  engine=(await WebAssembly.instantiate(bytes)).instance.exports;
  const initialGame=play(['human','bot','bot']);promptSavedTable();await initialGame;
} catch(err){report(err)}
</script></body></html>
